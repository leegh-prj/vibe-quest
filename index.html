const TOPICS={web:['프로젝트 목표·페이지 구성 정리','AI 개발 도구로 첫 화면 만들기','콘텐츠와 디자인 적용','모바일 반응형 개선','버튼과 문의 폼 구현','직접 테스트하고 버그 수정','웹사이트 배포와 재수정'],app:['사용자 문제와 핵심 기능 정리','AI로 첫 앱 화면 생성','화면 사이 이동 구현','입력 폼과 상태 연결','데이터 저장 구현','기능 테스트와 오류 해결','웹앱 배포 및 모바일 확인'],game:['게임 규칙과 승리 조건 기획','AI로 플레이 가능한 첫 화면 제작','캐릭터·입력·상태 구현','점수와 게임 진행 만들기','게임 종료와 재시작 구현','밸런스·버그 테스트','브라우저 게임 배포'],auto:['반복 업무 분석과 절차 정의','입력·출력 형식 설계','AI 도구로 처리 흐름 제작','샘플 데이터로 실행','오류 처리와 예외 상황 정의','자동화 결과 검증','실제 업무에 연결'],general:['바이브 코딩 도구 알아보기','AI에 명확히 요청하기','간단한 웹페이지 만들기','버튼 기능 직접 수정하기','저장과 데이터 흐름 체험','버그 분석과 수정하기','웹에 결과물 공개하기']};
const $=x=>document.getElementById(x);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(localStorage.getItem('vibequest-v1'))||{}}catch{data={}};data={type:'web',experience:'none',tool:'recommend',description:'',step:0,done:[],evidence:{},notes:{},criteria:{},aiHistory:{},projects:[],quizPassed:{},qa:{},goalReviews:[],retryLogs:{},...(data&&typeof data==='object'&&!Array.isArray(data)?data:{})};if(!Object.hasOwn(TYPES,data.type))data.type='web';if(!Array.isArray(data.done))data.done=[];data.done=data.done.slice(0,7).map(Boolean);for(const k of ['evidence','notes','criteria','aiHistory','quizPassed','qa'])if(!data[k]||typeof data[k]!=='object'||Array.isArray(data[k]))data[k]={};data.goalReviews=cleanGoalReviews(data.goalReviews);data.retryLogs=cleanRetryLogs(data.retryLogs);if(!Array.isArray(data.projects))data.projects=[];data.projects=data.projects.filter(p=>p&&typeof p==='object'&&!Array.isArray(p)&&Object.hasOwn(TYPES,p.type)&&Array.isArray(p.done)).slice(0,30).map(p=>({...p,description:typeof p.description==='string'?p.description:'',done:p.done.slice(0,7).map(Boolean),evidence:p.evidence&&typeof p.evidence==='object'&&!Array.isArray(p.evidence)?p.evidence:{},notes:p.notes&&typeof p.notes==='object'&&!Array.isArray(p.notes)?p.notes:{},criteria:p.criteria&&typeof p.criteria==='object'&&!Array.isArray(p.criteria)?p.criteria:{},aiHistory:p.aiHistory&&typeof p.aiHistory==='object'&&!Array.isArray(p.aiHistory)?p.aiHistory:{},quizPassed:p.quizPassed&&typeof p.quizPassed==='object'&&!Array.isArray(p.quizPassed)?p.quizPassed:{},qa:p.qa&&typeof p.qa==='object'&&!Array.isArray(p.qa)?p.qa:{},goalReviews:cleanGoalReviews(p.goalReviews),retryLogs:cleanRetryLogs(p.retryLogs),activeId:String(p.activeId||'legacy'),current:Number.isInteger(p.current)&&p.current>=0&&p.current<=6?p.current:null}));if(typeof data.description!=='string')data.description='';data.step=Number.isInteger(data.step)?Math.max(0,Math.min(3,data.step)):0;if(data.current!==undefined&&data.current!==null)data.current=Number.isInteger(data.current)?Math.max(0,Math.min(6,data.current)):0;const save=()=>{try{localStorage.setItem('vibequest-v1',JSON.stringify(data));return true}catch(err){console.error('학습 기록 저장 실패',err);const feedback=document.getElementById('feedback');if(feedback)feedback.textContent='저장 공간 또는 브라우저 설정 때문에 기록을 저장하지 못했습니다. 백업을 확인해 주세요.';return false}};const root=()=>$('root');
function page(p){if(p==='home')return home();if(p==='onboard')return onboard();if(p==='quest')return quest(data.current||0);dashboard()}
const IPHONE_QA_KEY='vibequest-iphone-qa-v1';
const IPHONE_QA_LABELS=['온보딩에서 프로젝트를 생성할 수 있음','퀘스트 버튼 및 선택지가 손가락 터치로 작동함','화면 좌우 잘림이나 가로 스크롤이 없음','메모 저장 후 Safari 재접속 시 기록이 유지됨','학습 기록 JSON 백업 파일을 저장할 수 있음'];
function iphoneQaLoad(){try{const v=JSON.parse(localStorage.getItem(IPHONE_QA_KEY)||'null');return {checks:Array.from({length:5},(_,i)=>v?.checks?.[i]===true),model:typeof v?.model==='string'?v.model.slice(0,100):'',ios:typeof v?.ios==='string'?v.ios.slice(0,40):'',note:typeof v?.note==='string'?v.note.slice(0,1500):''}}catch{return {checks:[false,false,false,false,false],model:'',ios:'',note:''}}}
function iphoneQaSave(){const checks=[...document.querySelectorAll('.iphone-qa-check')].map(x=>x.checked);const data={checks,model:$('iphoneModel').value.slice(0,100),ios:$('iphoneIos').value.slice(0,40),note:$('iphoneNote').value.slice(0,1500)};try{localStorage.setItem(IPHONE_QA_KEY,JSON.stringify(data));$('iphoneQaStatus').textContent='이 기기의 테스트 기록이 저장되었습니다. 확인 '+checks.filter(Boolean).length+'/5개.';return true}catch{$('iphoneQaStatus').textContent='저장 공간 또는 브라우저 설정으로 기록을 저장하지 못했습니다. 보고서 파일은 별도로 저장할 수 있습니다.';return false}}
function iphoneQaExport(){const checks=[...document.querySelectorAll('.iphone-qa-check')].map(x=>x.checked);const report={format:'vibequest-iphone-qa',version:1,createdAt:new Date().toISOString(),device:{model:$('iphoneModel').value.slice(0,100),ios:$('iphoneIos').value.slice(0,40)},checks:IPHONE_QA_LABELS.map((name,i)=>({name,passed:checks[i]})),notes:$('iphoneNote').value.slice(0,1500),note:'사용자가 직접 기록한 수동 점검 결과이며 기기 기능에 대한 자동 검증 결과가 아닙니다.'};try{downloadFile('vibe-quest-iphone-qa.json',JSON.stringify(report,null,2),'application/json;charset=utf-8');$('iphoneQaStatus').textContent='아이폰 테스트 보고서를 파일로 생성했습니다.'}catch{$('iphoneQaStatus').textContent='파일 다운로드에 실패했습니다. Safari 다운로드 권한을 확인해 주세요.'}}
function iphoneQaSummary(){const checks=[...document.querySelectorAll('.iphone-qa-check')].map(x=>x.checked);const completed=checks.filter(Boolean).length;return ['VIBE QUEST 아이폰 수동 QA 결과','기기: '+($('iphoneModel').value.trim()||'미입력'),'iOS: '+($('iphoneIos').value.trim()||'미입력'),'점검: '+completed+'/5개 확인','',...IPHONE_QA_LABELS.map((name,i)=>(checks[i]?'[확인] ':'[미확인] ')+name),'','발견한 문제: '+($('iphoneNote').value.trim()||'기록 없음'),'','이 내용은 사용자 수동 점검 결과이며 자동 검증 결과가 아닙니다.'].join('\n')}
async function iphoneQaCopy(){const value=iphoneQaSummary();const status=$('iphoneQaStatus');try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(value);status.textContent='공유용 테스트 요약을 복사했습니다. 메신저 등에 붙여넣을 수 있습니다.'}catch{const field=$('iphoneQaShareText');field.hidden=false;field.value=value;field.focus();field.select();status.textContent='자동 복사가 제한되었습니다. 아래 텍스트를 직접 선택해 복사하세요.'}}

const IPHONE_ISSUE_KEY='vibequest-iphone-issues-v1';
const ISSUE_STATES={open:'미해결',working:'수정 중',verified:'재검증 완료'};
function loadIssues(){try{const a=JSON.parse(localStorage.getItem(IPHONE_ISSUE_KEY)||'[]');return Array.isArray(a)?a.slice(0,30).filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string').map(x=>({id:x.id.slice(0,80),title:x.title.slice(0,120),detail:typeof x.detail==='string'?x.detail.slice(0,1000):'',state:Object.hasOwn(ISSUE_STATES,x.state)?x.state:'open'})):[]}catch{return []}}
function storeIssues(a){try{localStorage.setItem(IPHONE_ISSUE_KEY,JSON.stringify(a));return true}catch{$('issueMessage').textContent='저장에 실패했습니다. Safari 저장 공간을 확인해 주세요.';return false}}
function addIssue(){const title=$('issueTitle').value.trim().slice(0,120),detail=$('issueDetail').value.trim().slice(0,1000);if(title.length<5){$('issueMessage').textContent='오류 제목을 5자 이상 입력해 주세요.';return}const a=loadIssues();if(a.length>=30){$('issueMessage').textContent='이슈는 최대 30개까지 저장할 수 있습니다.';return}if(!storeIssues([{id:'issue-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),title,detail,state:'open'},...a]))return;$('issueTitle').value='';$('issueDetail').value='';renderIssues();$('issueMessage').textContent='이슈가 등록되었습니다.'}
function setIssueState(id,state){if(!Object.hasOwn(ISSUE_STATES,state))return;const a=loadIssues(),item=a.find(x=>x.id===id);if(!item)return;item.state=state;if(storeIssues(a)){renderIssues();$('issueMessage').textContent='이슈 상태가 저장되었습니다.'}}
function deleteIssue(id){if(!confirm('이 QA 이슈를 삭제할까요?'))return;const a=loadIssues();if(!a.some(x=>x.id===id))return;if(storeIssues(a.filter(x=>x.id!==id))){renderIssues();$('issueMessage').textContent='이슈를 삭제했습니다.'}}
function renderIssues(){const a=loadIssues(),list=$('issueList');if(!list)return;const selected=$('issueStatusFilter')?.value||'all';const visible=selected==='all'?a:a.filter(x=>x.state===selected);$('issueCount').textContent='등록 '+a.length+'개 · 미완료 '+a.filter(x=>x.state!=='verified').length+'개';list.innerHTML=visible.length?visible.map(x=>'<article class="iphone-issue"><strong>'+esc(x.title)+'</strong><p class="note">'+esc(x.detail||'상세 기록 없음')+'</p><label>처리 상태<select aria-label="'+esc(x.title)+' 처리 상태" data-id="'+esc(x.id)+'" onchange="setIssueState(this.dataset.id,this.value)">'+Object.entries(ISSUE_STATES).map(([k,v])=>'<option value="'+k+'" '+(x.state===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><button class="btn ghost" data-id="'+esc(x.id)+'" onclick="deleteIssue(this.dataset.id)">이슈 삭제</button></article>').join('') :'<p class="note">'+(a.length?'선택한 상태에 해당하는 이슈가 없습니다.':'등록된 QA 이슈가 없습니다.')+'</p>'}
function exportIssues(){const report={format:'vibequest-iphone-issues',version:1,createdAt:new Date().toISOString(),device:{model:$('iphoneModel').value.slice(0,100),ios:$('iphoneIos').value.slice(0,40)},issues:loadIssues()};try{downloadFile('vibe-quest-iphone-issues.json',JSON.stringify(report,null,2),'application/json;charset=utf-8');$('issueMessage').textContent='QA 이슈 보고서를 다운로드했습니다.'}catch{$('issueMessage').textContent='다운로드에 실패했습니다.'}}
function issueSignature(x){return x.title.normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,' ').trim()+'||'+x.detail.normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,' ').trim()}
function issueTitleKey(x){return x.title.normalize('NFKC').toLocaleLowerCase().replace(/\s+/g,' ').trim()}
let pendingIssues=null;
function issueImportCancel(){pendingIssues=null;const preview=$('issueImportPreview');if(preview){preview.hidden=true;preview.textContent=''}const input=$('issueImportFile');if(input)input.value=''}
async function previewIssueImport(input){pendingIssues=null;const preview=$('issueImportPreview');preview.hidden=true;const file=input.files?.[0];if(!file)return;if(file.size>200000){$('issueMessage').textContent='이슈 파일은 200KB 이하만 가져올 수 있습니다.';input.value='';return}
try{const report=JSON.parse(await file.text());if(report?.format!=='vibequest-iphone-issues'||report.version!==1||!Array.isArray(report.issues)||report.issues.length>30)throw Error('invalid format');const valid=report.issues.every(x=>x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.id==='string'&&x.id.length>0&&x.id.length<=80&&typeof x.title==='string'&&x.title.trim().length>=5&&x.title.length<=120&&typeof x.detail==='string'&&x.detail.length<=1000&&Object.hasOwn(ISSUE_STATES,x.state));if(!valid)throw Error('invalid issues');
const source=report.issues.map(x=>({id:x.id,title:x.title.trim(),detail:x.detail,state:x.state}));const current=loadIssues();const seen=new Set(current.map(issueSignature));const titleKeys=new Set(current.map(issueTitleKey));const toAdd=[];let duplicates=0,similar=0;for(const x of source){const key=issueSignature(x);if(seen.has(key)){duplicates++;continue}if(titleKeys.has(issueTitleKey(x)))similar++;seen.add(key);titleKeys.add(issueTitleKey(x));toAdd.push(x)}if(current.length+toAdd.length>30)throw Error('limit');
pendingIssues={newItems:toAdd,duplicates,similar,filename:file.name,base:JSON.stringify(current)};preview.hidden=false;preview.textContent='가져오기 미리보기: 신규 '+toAdd.length+'개, 동일 내용 중복 제외 '+duplicates+'개, 제목이 같은 후보 '+similar+'개. 기존 이슈와 상태는 덮어쓰지 않습니다. 확인하면 신규 이슈만 추가합니다.';$('issueMessage').textContent='파일을 확인했습니다. 미리보기를 검토한 후 가져오기를 확정해 주세요.'}catch(e){$('issueMessage').textContent=e.message==='limit'?'이슈 30개 제한을 초과합니다. 기존 목록을 먼저 정리해 주세요.':'올바른 QA 이슈 JSON 파일인지 확인해 주세요.';pendingIssues=null}finally{input.value=''}}
function confirmIssueImport(){if(!pendingIssues)return;const p=pendingIssues,current=loadIssues();if(JSON.stringify(current)!==p.base){$('issueMessage').textContent='미리보기 이후 이슈 목록이 변경됐습니다. 파일을 다시 선택해 주세요.';issueImportCancel();return}const ids=new Set(current.map(x=>x.id));const incoming=p.newItems.map(x=>{let id=x.id;if(ids.has(id))id='import-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);ids.add(id);return {...x,id}});if(!storeIssues([...incoming,...current]))return;issueImportCancel();renderIssues();$('issueMessage').textContent='새 이슈 '+incoming.length+'개를 추가했습니다. 중복 '+p.duplicates+'개는 건너뛰었습니다.'}
function filterIssues(){renderIssues()}
function issueMarkup(){return '<div class="card" style="margin-top:16px"><h3>🐞 QA 오류·이슈 관리</h3><p class="muted">기기에서 발견한 문제를 등록하고 상태를 관리합니다. 테스터의 JSON을 가져와 취합할 수 있지만 서버 동기화는 되지 않습니다.</p><label class="field" for="issueTitle">오류 제목</label><input id="issueTitle" maxlength="120" placeholder="예: 가로 모드에서 버튼이 잘림"><label class="field" for="issueDetail">재현 순서 및 기대 동작 (선택)</label><textarea id="issueDetail" maxlength="1000" placeholder="어느 화면에서 무엇을 눌렀나요?"></textarea><div class="iphone-qa-actions"><button class="btn" onclick="addIssue()">QA 이슈 등록</button><button class="btn secondary" onclick="exportIssues()">이슈 목록 JSON 다운로드</button></div><h4>다른 테스터의 이슈 취합</h4><p class="note">기존에 다운로드한 QA 이슈 JSON을 선택하세요. 같은 제목과 상세 내용은 중복 제외하며, 제목만 같으면 별개의 이슈로 남겨 검토할 수 있게 합니다.</p><label class="field" for="issueImportFile">이슈 파일 가져오기</label><input id="issueImportFile" type="file" accept=".json,application/json" onchange="previewIssueImport(this)"><div class="issue-import-preview" id="issueImportPreview" hidden role="status" aria-live="polite"></div><div class="iphone-qa-actions"><button class="btn secondary" onclick="confirmIssueImport()" id="issueConfirmImport">미리보기 확인 후 가져오기</button><button class="btn ghost" onclick="issueImportCancel()">취소</button></div><p id="issueMessage" role="status" aria-live="polite"></p><strong id="issueCount"></strong><label class="field" for="issueStatusFilter">처리 상태별 보기</label><select id="issueStatusFilter" onchange="filterIssues()"><option value="all">모두 보기</option><option value="open">미해결</option><option value="working">수정 중</option><option value="verified">재검증 완료</option></select><div id="issueList"></div></div>'}
function iphoneQaReset(){if(!confirm('이 기기의 아이폰 테스트 체크 상태와 기기 정보를 초기화할까요? 학습 기록은 유지됩니다.'))return;try{localStorage.removeItem(IPHONE_QA_KEY)}catch{}iphoneGuide()}
function iphoneGuide(){const q=iphoneQaLoad();layout('<button class="btn ghost" onclick="home()">← 홈으로</button><h1>📱 아이폰 테스트 안내</h1><p class="muted">Safari에서 VIBE QUEST의 학습 기능을 테스트하세요. App Store 설치 없이 이용할 수 있는 웹 버전입니다.</p><div class="card"><h3>홈 화면에서 앱처럼 열기</h3><ol class="iphone-steps"><li>아이폰 Safari에서 <strong>vibe-quest-delta.vercel.app</strong>에 접속합니다.</li><li>Safari의 공유 메뉴를 열고 <strong>홈 화면에 추가</strong>를 선택합니다.</li><li>홈 화면의 VIBE QUEST 바로가기를 눌러 실행합니다.</li></ol><p class="notice">Safari의 홈 화면 추가 메뉴 위치는 iOS 버전에 따라 달라질 수 있습니다. 일반 브라우저 탭에서도 테스트 가능합니다.</p></div><div class="card" style="margin-top:16px"><h3>아이폰 테스트 체크리스트</h3><p class="note">실제 기기에서 다음 항목을 순서대로 직접 확인해 주세요.</p><div class="iphone-qa-fields"><label class="field" for="iphoneModel">iPhone 모델 (선택)</label><input id="iphoneModel" maxlength="100" oninput="iphoneQaSave()" value="'+esc(q.model)+'" placeholder="예: iPhone 15"><label class="field" for="iphoneIos">iOS 버전 (선택)</label><input id="iphoneIos" maxlength="40" oninput="iphoneQaSave()" value="'+esc(q.ios)+'" placeholder="예: iOS 18"></div>'+IPHONE_QA_LABELS.map((label,i)=>'<label class="check"><input class="iphone-qa-check" type="checkbox" onchange="iphoneQaSave()" '+(q.checks[i]?'checked':'')+'><span>'+esc(label)+'</span></label>').join('')+'<label class="field" for="iphoneNote">발견한 문제·재현 방법 (선택)</label><textarea id="iphoneNote" maxlength="1500" oninput="iphoneQaSave()" placeholder="예: Safari에서 두 번째 퀘스트 버튼이 눌리지 않음">'+esc(q.note)+'</textarea><p class="note" id="iphoneQaStatus" role="status" aria-live="polite">이 기기에 저장된 점검 '+q.checks.filter(Boolean).length+'/5개. 결과는 서버로 전송되지 않습니다.</p><div class="iphone-qa-actions"><button class="btn" onclick="iphoneQaCopy()">공유용 요약 복사</button><button class="btn secondary" onclick="iphoneQaExport()">테스트 결과 JSON 다운로드</button><button class="btn ghost" onclick="iphoneQaReset()">점검 기록 초기화</button></div><textarea id="iphoneQaShareText" hidden readonly aria-label="직접 복사할 테스트 요약"></textarea><p class="note">테스트 체크와 기기 정보는 해당 브라우저에 별도로 저장됩니다. JSON 보고서에는 직접 입력한 기기 정보와 오류 내용이 포함되므로 공유 전 확인하세요.</p><button class="btn secondary" onclick="start()">새 프로젝트로 테스트 시작 →</button><button class="btn ghost" style="margin:8px" onclick="showBackup()">학습 기록 백업·복원</button></div>'+issueMarkup()+'<div class="card" style="margin-top:16px"><h3>테스트 전 알아둘 점</h3><p class="muted">학습 기록은 해당 브라우저의 로컬 저장소에 보관됩니다. Safari 사이트 데이터를 삭제하거나 다른 브라우저/홈 화면 실행 환경을 이용하면 기록이 공유되지 않을 수 있으니, 중요한 기록은 JSON으로 백업하세요.</p><p class="note">문제가 있으면 iPhone 모델, iOS 버전, 발생 화면, 오류 재현 순서와 스크린샷을 함께 남겨 주세요.</p></div>');renderIssues()}
function home(){root().innerHTML='<div class="wrap"><section class="hero"><div><span class="tag">AI와 함께하는 실전 프로젝트 학습</span><h1>아이디어만 있으면,<br>당신도 만들 수 있어요.</h1><p>코딩을 몰라도 괜찮아요. 만들고 싶은 프로젝트를 정하면 AI와 함께 기획부터 제작·테스트·배포까지 직접 경험합니다.</p><div class="quick-actions"><button class="btn" onclick="start()">새 프로젝트 시작하기 →</button><button class="btn ghost" onclick="iphoneGuide()">📱 아이폰 테스트 안내</button>'+(data.activeId&&data.description?'<button class="btn secondary" onclick="dashboard()">기존 학습 이어가기 →</button>':'')+'</div></div><div class="art">👩🏻‍💻 ✨</div></section><section class="tiles">'+Object.entries(TYPES).map(([k,v])=>'<div class="tile"><span>'+v[0]+'</span>'+v[1]+'</div>').join('')+'</section></div>'}
function start(){if(data.description||data.done.some(Boolean)||Object.keys(data.evidence||{}).length||Object.keys(data.notes||{}).length||(data.projects||[]).some(p=>p.activeId===data.activeId))archiveCurrent();data.activeId='project-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);data.type='web';data.description='';data.experience='none';data.tool='recommend';data.done=[];data.evidence={};data.notes={};data.criteria={};data.aiPlan='';data.aiHistory={};data.quizPassed={};data.qa={};data.goalReviews=[];data.retryLogs={};data.current=null;data.step=0;save();onboard()}

function templateListMarkup(){return '<section class="starter-templates" aria-label="시작 프로젝트 예제"><h3>5분 시작용 예제 선택 (선택)</h3><p class="muted">원하는 예제를 누르면 설명에 채워집니다. 이후 자유롭게 수정할 수 있습니다.</p><div class="starter-options">'+(STARTER_TEMPLATES[data.type]||STARTER_TEMPLATES.general).map((x,i)=>'<button class="starter-option" type="button" onclick="selectStarter('+i+')"><strong>'+esc(x.title)+'</strong><small>'+esc(x.first)+'</small></button>').join('')+'</div></section>'}
function selectStarter(i){const item=(STARTER_TEMPLATES[data.type]||STARTER_TEMPLATES.general)[i];if(!item||data.step!==1)return;const idea=$('idea');if(!idea)return;idea.value=item.idea;saveOnboardIdea();$('ideaHint').textContent='선택한 예제를 바탕으로 내용을 수정할 수 있습니다.'}
const STARTER_RECIPES={

 general:[['첫 제목과 좋아하는 것 3개 정하기','제목과 카드 3개가 모바일에서도 보이는지 확인','긴 글자가 카드 밖으로 나가지 않게 줄바꿈을 적용해 달라고 요청'],['응원 문구 3개를 적기','버튼을 누르면 문구가 바뀌는지 확인','버튼 연속 클릭에도 문구가 비어 있지 않도록 요청']]

function starterForCurrent(){const items=STARTER_TEMPLATES[data.type]||STARTER_TEMPLATES.general;const index=items.findIndex(t=>t.idea===data.description.trim());return index<0?null:{template:items[index],recipe:(STARTER_RECIPES[data.type]||STARTER_RECIPES.general)[index]}}
function starterSuccessMarkup(x,i){const checks=i===0?['필요한 첫 화면을 한 문장으로 설명할 수 있음','입력·출력과 핵심 기능을 구분함']:i===1?['개발 도구가 만든 화면을 직접 열어봄',x.recipe[1]]:i===4?[x.recipe[1],'정상 조작과 예외 조작을 각각 한 번 이상 확인']:['같은 오류를 재현한 후 수정 결과를 직접 확인','수정 전 정상 기능이 계속 작동하는지 확인'];return '<div class="starter-success"><strong>이 단계의 성공 기준 (직접 확인)</strong><ul>'+checks.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><p class="note">이 기준은 실습 참고용이며 체크만으로 퀘스트가 완료되지는 않습니다.</p></div>'}
function starterPracticeMarkup(i){const x=starterForCurrent();if(!x||![0,1,4,5].includes(i))return '';const stage=i===0?'기획':i===1?'첫 화면 제작':i===4?'실제 기능 확인':'오류 수정';const steps=i===0?[x.recipe[0],'완료할 핵심 기능 3개 중 첫 번째를 한 문장으로 정리','결과 화면에 필요한 입력과 출력을 나누어 적기']:i===1?['AI 도구에 아래 요청문을 전달하고 결과물을 실행',x.recipe[1],'실행한 화면에서 이상한 부분을 한 가지 찾아 기록']:i===4?[x.recipe[1],'정상 입력 1회와 빈 입력 또는 반복 클릭 1회 비교','기대했던 화면과 실제 결과의 차이를 기록']:['발생한 현상을 같은 순서로 2회 재현',x.recipe[2],'수정 후 처음부터 다시 실행해 이전 기능도 확인'];return '<section class="starter-practice" aria-labelledby="starterPracticeTitle"><h3 id="starterPracticeTitle">🧪 '+esc(x.template.title)+' · '+stage+' 실습</h3><p class="note">선택한 시작 예제에 맞춘 실습 순서입니다. 자동으로 구현되거나 테스트되는 것은 아닙니다.</p><ol>'+steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>'+starterSuccessMarkup(x,i)+'<details><summary>막혔을 때 수정 요청 예시 보기</summary><p class="note">'+esc(x.recipe[2])+'</p><p class="note">기존에 정상 작동하던 부분과 저장 데이터는 유지하고 수정 결과를 직접 확인하세요.</p></details></section>'}
function firstFiveMarkup(){if(data.done.some(Boolean)||Object.keys(data.notes||{}).length||Object.keys(data.evidence||{}).length)return '';const items=STARTER_TEMPLATES[data.type]||STARTER_TEMPLATES.general;const example=items.find(x=>data.description.trim()===x.idea);const first=example?.first||'프로젝트를 사용할 사람과 첫 화면에서 꼭 보여줄 내용 3개 적기';return '<section class="card first-five" aria-labelledby="firstFiveTitle"><h2 id="firstFiveTitle">⏱ 첫 5분, 여기서 시작하세요</h2><p class="muted">이 안내는 첫 실습을 돕는 예시이며 실제 코드를 자동 생성하거나 실행하지 않습니다.</p><ol><li><b>1분:</b> '+esc(first)+'</li><li><b>2분:</b> QUEST 1에서 제공하는 AI 요청문을 복사해 개발 도구에 붙여넣기</li><li><b>2분:</b> 결과를 직접 열고 문제점 한 가지 메모하기</li></ol><button class="btn" onclick="quest(0)">첫 실습 시작 →</button></section>'}

function pick(k){data[data.step===0?'type':data.step===2?'experience':'tool']=k;save();onboard()}function back(){if(data.step===1)saveOnboardIdea();if(data.step>0){data.step--;save();onboard()}else home()}function next(){if(data.step===1)data.description=$('idea').value.trim();if(data.step<3){data.step++;save();onboard()}else{archiveCurrent();save();dashboard()}}

const STEPS={
web:['사이트 구조','디자인 적용','공개 주소'],app:['핵심 화면','작동 기능','사용 가능한 웹앱'],game:['게임 플레이','게임 규칙','공유 가능한 게임'],auto:['업무 분석','자동 실행','처리 결과'],general:['첫 페이지','실습 응용','작은 프로젝트 완성']};
function userProject(){return data.description.trim()||TYPES[data.type][1]+' 첫 프로젝트'}
function projectPlan(){const desc=data.description.toLowerCase();const words=desc.includes('포트폴리오')?['자기소개','작업물 목록','연락하기']:desc.includes('예약')?['예약 정보 입력','예약 확인','예약 목록']:desc.includes('쇼핑')||desc.includes('상품')?['상품 목록','상세 화면','문의 기능']:desc.includes('게임')||data.type==='game'?['게임 시작','진행 및 점수','다시하기']:desc.includes('일정')||desc.includes('할 일')?['일정 입력','목록 보기','완료 처리']:STEPS[data.type];return words;}
function resumeQuestIndex(){const current=data.current;const first=Array.from({length:7},(_,i)=>!!data.done[i]).findIndex(x=>!x);if(first===-1)return 6;if(Number.isInteger(current)&&current>=0&&current<=6&&!data.done[current])return current;return first}
function learningRecordsMarkup(){const entries=TOPICS[data.type].map((title,i)=>({title,done:!!data.done[i],evidence:typeof data.evidence?.[i]==='string'?data.evidence[i]:'',note:typeof data.notes?.[i]==='string'?data.notes[i]:''}));const count=entries.filter(x=>x.done).length;const recorded=entries.filter(x=>x.evidence||x.note).length;return `<section class="card learning-records" aria-labelledby="recordsTitle"><h2 id="recordsTitle">📚 내 학습 기록 한눈에 보기</h2><p class="muted">${count}개 퀘스트 완료 · ${recorded}개 퀘스트에 기록 있음</p><p class="note">이 기록은 직접 입력한 증빙과 자기점검 결과입니다. 결과물의 기능을 플랫폼이 자동 검증한 것은 아닙니다.</p><div class="record-list">${entries.map((x,i)=>`<div class="record-item"><div><strong>QUEST ${i+1} · ${esc(x.title)}</strong><p class="note">${x.done?'✓ 완료':x.evidence||x.note?'작성 중':'시작 전'}</p>${x.evidence||x.note?`<details class="record-disclosure"><summary>저장된 기록 펼쳐보기</summary>${x.evidence?`<p class="record-detail"><b>증빙</b> ${esc(x.evidence.slice(0,110))}${x.evidence.length>110?'…':''}</p>`:''}${x.note?`<p class="record-detail"><b>메모</b> ${esc(x.note.slice(0,110))}${x.note.length>110?'…':''}</p>`:''}</details>`:''}</div><button class="btn ghost" onclick="quest(${i})" aria-label="QUEST ${i+1} 학습 기록 보기">기록 보기</button></div>`).join('')}</div></section>`}
function cleanGoalReviews(raw){return Array.from({length:3},(_,i)=>{const x=Array.isArray(raw)?raw[i]:null;const status=['planned','built','tested'].includes(x?.status)?x.status:'planned';const evidence=typeof x?.evidence==='string'?x.evidence.slice(0,600):'';return {status,evidence}})}
function goalReviewMarkup(){const goals=projectPlan(),items=cleanGoalReviews(data.goalReviews);const built=items.filter(x=>x.status!=='planned').length,tested=items.filter(x=>x.status==='tested').length;return '<section class="card goal-review" aria-labelledby="goalReviewTitle"><h2 id="goalReviewTitle">🎯 프로젝트 목표·결과물 검증</h2><p class="muted">제안된 핵심 기능 3개를 실제로 만들고 직접 테스트했는지 별도로 기록합니다. 학습 퀘스트 완료 여부와는 별개입니다.</p><p id="goalReviewSummary" class="pill" role="status" aria-live="polite">구현 '+built+'/3개 · 직접 테스트 '+tested+'/3개</p><div class="goal-review-list">'+goals.map((title,i)=>'<div class="goal-review-item"><strong>기능 '+(i+1)+' · '+esc(title)+'</strong><label class="field" for="goalStatus'+i+'">현재 확인 단계</label><select id="goalStatus'+i+'" onchange="saveGoalReview()" aria-label="기능 '+(i+1)+' 확인 단계"><option value="planned" '+(items[i].status==='planned'?'selected':'')+'>미구현·확인 전</option><option value="built" '+(items[i].status==='built'?'selected':'')+'>구현함 (직접 테스트 전)</option><option value="tested" '+(items[i].status==='tested'?'selected':'')+'>직접 테스트 완료</option></select><label class="field" for="goalEvidence'+i+'">작업·검증 근거</label><textarea id="goalEvidence'+i+'" maxlength="600" oninput="saveGoalReview()" placeholder="예: 모바일에서 버튼 클릭과 결과 표시 확인, 결과물 주소">'+esc(items[i].evidence)+'</textarea><p class="note">검증 결과는 사용자 직접 입력 기준이며 플랫폼에서 코드를 자동 검사하지 않습니다.</p></div>').join('')+'</div><p id="goalSaveMessage" class="note" role="status" aria-live="polite"></p></section>'}
function saveGoalReview(){const previous=cleanGoalReviews(data.goalReviews);const reviews=Array.from({length:3},(_,i)=>({status:$('goalStatus'+i).value,evidence:$('goalEvidence'+i).value.trim().slice(0,600)}));for(let i=0;i<3;i++)if(reviews[i].status==='tested'&&reviews[i].evidence.length<8){reviews[i].status='built';$('goalStatus'+i).value='built';$('goalSaveMessage').textContent='직접 테스트 완료를 선택하려면 해당 기능의 검증 근거를 8자 이상 적어 주세요.'}
data.goalReviews=reviews;if(!save()){data.goalReviews=previous;$('goalSaveMessage').textContent='저장에 실패했습니다. 기존 기록을 유지합니다.';return}const built=reviews.filter(x=>x.status!=='planned').length,tested=reviews.filter(x=>x.status==='tested').length;$('goalReviewSummary').textContent='구현 '+built+'/3개 · 직접 테스트 '+tested+'/3개'}
function nextActionSuggestions(){const out=[];const current=Number.isInteger(data.current)&&data.current>=0&&data.current<7?data.current:null;const issues=[];for(let i=0;i<7;i++){const logs=data.retryLogs?.[i];if(Array.isArray(logs)&&logs.length&&logs[logs.length-1]?.status==='retry')issues.push(i)}const firstIssue=issues.includes(current)?current:issues[0];if(firstIssue!==undefined){const logs=data.retryLogs[firstIssue];out.push({kind:'retry',title:'해결하지 못한 문제 다시 확인',detail:'QUEST '+(firstIssue+1)+' · '+logs[logs.length-1].problem.slice(0,90),index:firstIssue})}const goals=cleanGoalReviews(data.goalReviews);const goalIndex=goals.findIndex(x=>x.status==='built');if(goalIndex>=0)out.push({kind:'goal',title:'구현한 핵심 기능 직접 테스트',detail:'기능 '+(goalIndex+1)+' · '+projectPlan()[goalIndex],index:goalIndex});if((data.done||[]).filter(Boolean).length<7){const i=resumeQuestIndex();out.push({kind:'quest',title:'미완료 퀘스트 이어서 진행',detail:'QUEST '+(i+1)+' · '+TOPICS[data.type][i],index:i})}const planned=goals.findIndex(x=>x.status==='planned');if(planned>=0)out.push({kind:'goal',title:'핵심 기능 구현 시작',detail:'기능 '+(planned+1)+' · '+projectPlan()[planned],index:planned});if(!out.length)out.push({kind:'complete',title:'현재 기록상 모든 점검 완료',detail:'7단계와 핵심 기능 3개의 수동 기록을 다시 검토하세요.',index:0});return out.slice(0,3)}
function focusGoal(index){const el=$('goalStatus'+index);if(!el)return dashboard();document.getElementById('goalReviewTitle')?.scrollIntoView({behavior:'auto',block:'start'});el.focus()}
function doNextAction(kind,index){if(kind==='retry'||kind==='quest')return quest(index);if(kind==='goal')return focusGoal(index);dashboard()}
function nextActionsMarkup(){const actions=nextActionSuggestions();return '<section class="card next-actions" aria-labelledby="nextActionsTitle"><h2 id="nextActionsTitle">🧭 지금 해야 할 다음 행동</h2><p class="muted">이 프로젝트의 미해결 기록·핵심 기능 검증·미완료 퀘스트를 기준으로 추천합니다. 자동 테스트나 AI 분석 결과는 아닙니다.</p><div class="next-action-list">'+actions.map((a,i)=>'<div class="next-action"><div><strong>'+(i===0?'우선 · ':'')+esc(a.title)+'</strong><p class="note">'+esc(a.detail)+'</p></div><button class="btn '+(i===0?'':'secondary')+'" onclick="doNextAction(&quot;'+a.kind+'&quot;,'+a.index+')">'+(a.kind==='goal'?'목표 확인 →':a.kind==='complete'?'기록 다시 보기 →':'바로 진행 →')+'</button></div>').join('')+'</div></section>'}
function projectOutcomeReport(){const reviews=cleanGoalReviews(data.goalReviews),steps=TOPICS[data.type],goals=projectPlan();const quests=steps.map((name,i)=>({name,completed:!!data.done?.[i],evidence:typeof data.evidence?.[i]==='string'?data.evidence[i].slice(0,500):''}));const features=goals.map((name,i)=>({name,status:reviews[i].status,evidence:reviews[i].evidence}));const retrySteps=Array.from({length:7},(_,i)=>({quest:i+1,entries:Array.isArray(data.retryLogs?.[i])?data.retryLogs[i]:[]})).filter(x=>x.entries.length);const retries=retrySteps.reduce((n,x)=>n+x.entries.length,0);const unresolved=retrySteps.filter(x=>x.entries[x.entries.length-1].status!=='resolved');const resolved=retrySteps.filter(x=>x.entries[x.entries.length-1].status==='resolved');const pendingFeatures=features.map((x,i)=>({...x,index:i})).filter(x=>x.status!=='tested');const pendingQuests=quests.map((x,i)=>({...x,index:i})).filter(x=>!x.completed);return {format:'vibequest-project-outcome',version:1,generatedAt:new Date().toISOString(),project:{name:userProject(),type:TYPES[data.type][1]},summary:{completedQuests:quests.filter(x=>x.completed).length,totalQuests:7,testedFeatures:features.filter(x=>x.status==='tested').length,builtFeatures:features.filter(x=>x.status!=='planned').length,totalFeatures:3,retryRecords:retries,resolvedTopics:resolved.length,unresolvedTopics:unresolved.length},quests,features,unresolved:unresolved.map(x=>({quest:x.quest,problem:x.entries[x.entries.length-1].problem})),resolved:resolved.map(x=>({quest:x.quest,problem:x.entries[x.entries.length-1].problem})),nextWork:{pendingFeatures:pendingFeatures.map(x=>({index:x.index,name:x.name,status:x.status})),pendingQuests:pendingQuests.map(x=>({index:x.index,name:x.name}))},disclaimer:'사용자가 기록한 학습 상태와 직접 확인 결과의 요약이며 실제 코드·배포의 자동 검증 결과가 아닙니다.'}}
function outcomeReportText(r){return ['VIBE QUEST · 프로젝트 성과 리포트','프로젝트: '+r.project.name,'유형: '+r.project.type,'퀘스트 완료: '+r.summary.completedQuests+'/7','핵심 기능 직접 테스트: '+r.summary.testedFeatures+'/3','구현 기록: '+r.summary.builtFeatures+'/3','재시도 기록: '+r.summary.retryRecords+'건 · 최근 기록 기준 미해결 '+r.summary.unresolvedTopics+'개 퀘스트 · 해결 '+r.summary.resolvedTopics+'개 퀘스트','','[핵심 기능]',...r.features.map((x,i)=>(i+1)+'. '+x.name+' · '+({planned:'미구현',built:'구현·미검증',tested:'직접 테스트 완료'}[x.status])+(x.evidence?' / 근거: '+x.evidence:'')),'','[학습 퀘스트]',...r.quests.map((x,i)=>(i+1)+'. '+x.name+' · '+(x.completed?'완료':'미완료')),'','[미해결 문제]',...(r.unresolved.length?r.unresolved.map(x=>'QUEST '+x.quest+' · '+x.problem):['최근 기록 기준 없음']),'','[남은 핵심 기능]',...(r.nextWork.pendingFeatures.length?r.nextWork.pendingFeatures.map(x=>x.name):['현재 기록상 모두 검증됨']),'',r.disclaimer].join('\n')}

function outcomeReportMarkup(){const r=projectOutcomeReport(),a=r.summary;return '<section class="card outcome-report" aria-labelledby="outcomeReportTitle"><h2 id="outcomeReportTitle">📊 프로젝트 성과 리포트</h2><p class="muted">실제 학습 기록을 모아 진행 상황과 남은 작업을 요약합니다. 성공·해결 여부는 사용자가 직접 확인한 기록 기준입니다.</p><div class="outcome-stats"><div><strong>'+a.completedQuests+'/7</strong><span>퀘스트 완료</span></div><div><strong>'+a.testedFeatures+'/3</strong><span>핵심 기능 검증</span></div><div><strong>'+a.resolvedTopics+'</strong><span>해결 기록된 퀘스트</span></div><div><strong>'+a.unresolvedTopics+'</strong><span>미해결 기록된 퀘스트</span></div></div><p class="note">재시도 기록 총 '+a.retryRecords+'건 · 최근 기록 상태 기준으로 퀘스트별 해결 여부를 집계합니다.</p><h3>아직 남은 작업</h3><div class="outcome-pending">'+(r.unresolved.length?r.unresolved.map(x=>'<div class="outcome-row"><span>재검증 · QUEST '+x.quest+' · '+esc(x.problem.slice(0,100))+'</span><button class="btn ghost" onclick="quest('+ (x.quest-1) +')">재시도 보기</button></div>').join(''):'')+r.nextWork.pendingFeatures.map(x=>'<div class="outcome-row"><span>핵심 기능 · '+esc(x.name)+' ('+(x.status==='built'?'구현·검증 필요':'구현 전')+')</span><button class="btn ghost" onclick="focusGoal('+x.index+')">기능 확인</button></div>').join('')+(r.nextWork.pendingQuests.length?'<div class="outcome-row"><span>다음 학습 · QUEST '+(resumeQuestIndex()+1)+' · '+esc(TOPICS[data.type][resumeQuestIndex()])+'</span><button class="btn ghost" onclick="quest('+resumeQuestIndex()+')">학습하기</button></div>':'')+(!r.unresolved.length&&!r.nextWork.pendingFeatures.length&&!r.nextWork.pendingQuests.length?'<p class="note">현재 기록상 모든 항목이 완료됐습니다. 실제 결과물은 직접 다시 확인하세요.</p>':'')+'</div><div class="outcome-controls"><button class="btn secondary" onclick="exportOutcomeReport()">성과 요약 TXT 저장</button><button class="btn secondary" onclick="copyOutcomeReport()">공유용 요약 복사</button><button class="btn secondary" onclick="printOutcomeReport()">리포트 인쇄·PDF</button></div><textarea id="outcomeShareFallback" hidden readonly aria-label="직접 복사할 성과 리포트"></textarea><p id="outcomeExportStatus" class="note" role="status" aria-live="polite"></p></section>'}
function dashboard(){const t=TYPES[data.type],done=data.done.filter(Boolean).length,features=projectPlan();layout(`<span class="tag">내 목표에 맞춘 실전 학습</span><h1>${t[0]} ${t[1]} 프로젝트</h1><p class="muted">${esc(userProject())}</p><div class="card"><strong>프로젝트 MVP 범위</strong><p class="muted">목표에 맞게 먼저 만들 최소 기능 3가지를 제안합니다. AI가 실시간 생성한 결과는 아니며, 프로젝트 키워드 기반의 시작 템플릿입니다.</p><div class="milestones">${features.map((v,i)=>`<div class="milestone"><b>기능 ${i+1}</b>${esc(v)}</div>`).join('')}</div><div class="split"><button class="btn secondary" onclick="exportPlan()">학습 계획 파일 저장 ↓</button><button class="btn ghost" onclick="showBackup()">전체 기록 백업·복원</button></div></div><div class="card" style="margin-top:16px"><h3>✨ AI 맞춤형 로드맵 코치</h3><p class="muted">프로젝트 목표를 바탕으로 실제 AI가 MVP 범위와 7단계 작업을 자세히 제안합니다. AI 연결이 없으면 기본 로드맵은 그대로 사용할 수 있습니다.</p><button class="btn" id="roadmapBtn" onclick="makeAIPlan()">AI 로드맵 생성</button><div id="aiPlan" class="aiout" style="display:${data.aiPlan?'block':'none'}">${esc(data.aiPlan||'')}</div></div><h2>학습 진행 현황</h2><div class="card"><span class="pill">완료 ${done} / 7 퀘스트</span><div class="bar" role="progressbar" aria-label="퀘스트 완료율" aria-valuemin="0" aria-valuemax="7" aria-valuenow="${done}" style="margin-top:15px"><div class="fill" style="width:${done/7*100}%"></div></div><p class="note">완료 판정은 현재 자기점검과 작업 기록 기반입니다. 자동 코드 QA 및 AI 평가는 추후 적용합니다.</p></div><div class="focus-banner"><strong>🎯 이어서 학습하기</strong><p>${done===7?"모든 퀘스트를 완료했습니다. 마지막 퀘스트 기록을 다시 확인할 수 있습니다.":Number.isInteger(data.current)&&data.current>=0&&data.current<=6&&!data.done[data.current]?"마지막으로 작업한 퀘스트에서 이어서 진행하세요.":"아직 완료하지 않은 첫 번째 퀘스트부터 진행하세요."}</p><p class="note">QUEST ${resumeQuestIndex()+1} · ${esc(TOPICS[data.type][resumeQuestIndex()])}</p><button class="btn" id="resumeQuestBtn" onclick="quest(${resumeQuestIndex()})">${done===7?"완주 기록 보기 →":"이어서 학습하기 →"}</button></div>${firstFiveMarkup()}${nextActionsMarkup()}${outcomeReportMarkup()}${goalReviewMarkup()}${learningRecordsMarkup()}<h2>나의 실전 퀘스트</h2><div class="steps">${TOPICS[data.type].map((q,i)=>`<button class="step" onclick="quest(${i})"><span class="num">${data.done[i]?'✓':i+1}</span><span><strong>${esc(q)}</strong><br><span class="progress">${data.done[i]?'완료 · 다시 보기':data.evidence[i]?'진행 기록 있음':'실습 시작하기'}</span></span></button>`).join('')}</div>`)}

function cleanRetryLogs(v){const out={};if(!v||typeof v!=='object'||Array.isArray(v))return out;for(let i=0;i<7;i++){const a=v[i];if(!Array.isArray(a))continue;out[i]=a.slice(-5).filter(x=>x&&typeof x==='object').map(x=>({problem:typeof x.problem==='string'?x.problem.slice(0,500):'',expected:typeof x.expected==='string'?x.expected.slice(0,500):'',before:typeof x.before==='string'?x.before.slice(0,500):'',after:typeof x.after==='string'?x.after.slice(0,500):'',status:x.status==='resolved'?'resolved':'retry'}))}return out}
function retryComparisonMarkup(records){
if(!Array.isArray(records)||records.length<2)return '';
const before=records[records.length-2],after=records[records.length-1];
const label=r=>r.status==='resolved'?'직접 확인 후 해결':'재시도·검증 필요';
const changed=before.status!==after.status;
const outcome=changed?(after.status==='resolved'?'미해결 → 해결 기록으로 변경':'해결 → 재검증 필요 기록으로 변경'):(after.status==='resolved'?'두 기록 모두 해결로 기록됨':'두 기록 모두 추가 수정·검증 필요');
const detail=(title,oldValue,newValue)=>'<div class="retry-diff-row"><b>'+esc(title)+'</b><p><span class="retry-diff-label">이전</span> '+esc(oldValue||'기록 없음')+'</p><p><span class="retry-diff-label">최근</span> '+esc(newValue||'기록 없음')+'</p></div>';
const fields=[['문제',before.problem,after.problem],['기대 동작',before.expected,after.expected],['수정 전 확인',before.before,after.before],['수정 후 확인',before.after,after.after]];
const changedFields=fields.filter(x=>x[1]!==x[2]);
return '<div class="retry-comparison" role="status" aria-label="재시도 비교"><strong>이전 시도 대비 최근 기록</strong><p><b>'+esc(label(before))+' → '+esc(label(after))+'</b></p><p>'+esc(outcome)+'</p><p class="note">내용 변경 '+changedFields.length+'개 항목 · 상태 변경 '+(changed?'있음':'없음')+'</p>'+(changedFields.length?'<details><summary>변경된 내용 비교 ('+changedFields.length+')</summary>'+changedFields.map(x=>detail(x[0],x[1],x[2])).join('')+'</details>':'<p class="note">입력 내용은 이전 기록과 동일합니다.</p>')+'<p class="note">사용자의 직접 확인 기록만 비교하며, 실제 오류 해결을 자동 판정하지 않습니다.</p></div>';
}
function retryMarkup(i){const records=(data.retryLogs?.[i]||[]);return '<section class="retry-panel" aria-label="오류 해결 재시도 기록"><h3>🛠 문제 해결·재시도 기록</h3><p class="note">작동하지 않는 부분과 기대 결과를 적으면 AI 개발 도구에 전달할 수정 요청문을 생성합니다. 실제 수정·검증은 직접 진행해야 합니다.</p><label class="field" for="retryProblem">현재 발생하는 문제</label><textarea id="retryProblem" maxlength="500" placeholder="예: iPhone에서 메뉴 버튼을 눌러도 열리지 않아요."></textarea><label class="field" for="retryExpected">원하는 정상 동작</label><textarea id="retryExpected" maxlength="500" placeholder="예: 메뉴가 열리고 각 페이지로 이동해야 해요."></textarea><button class="btn secondary" onclick="buildRetryPrompt('+i+')">수정 요청문 생성</button><label class="field" for="retryPrompt">AI에 전달할 요청문 (직접 선택·복사 가능)</label><textarea id="retryPrompt" readonly></textarea><label class="field" for="retryBefore">수정 전 확인 내용 (선택)</label><textarea id="retryBefore" maxlength="500" placeholder="오류를 재현한 화면이나 조작 순서"></textarea><label class="field" for="retryAfter">수정 후 직접 확인한 결과 (선택)</label><textarea id="retryAfter" maxlength="500" placeholder="수정 후 다시 눌러보니 정상 작동함"></textarea><label class="field" for="retryStatus">현재 해결 상태</label><select id="retryStatus"><option value="retry">재시도·검증 필요</option><option value="resolved">직접 확인 후 해결</option></select><button class="btn" onclick="saveRetry('+i+')">재시도 기록 저장</button><p id="retryMessage" class="note" role="status" aria-live="polite"></p>'+retryComparisonMarkup(records)+'<div class="retry-history"><strong>이전 재시도 기록 ('+records.length+'/5)</strong>'+ (records.length?records.slice().reverse().map((r,j)=>'<div class="retry-entry"><span class="pill">'+(r.status==='resolved'?'직접 확인 후 해결':'재시도·검증 필요')+'</span><p><b>문제</b> '+esc(r.problem)+'</p><p><b>기대 결과</b> '+esc(r.expected)+'</p>'+(r.before?'<p><b>수정 전</b> '+esc(r.before)+'</p>':'')+(r.after?'<p><b>수정 후</b> '+esc(r.after)+'</p>':'')+'</div>').join(''):'<p class="note">저장된 재시도 기록이 없습니다.</p>')+'</div></section>'}
function retryInputs(){return {problem:$('retryProblem').value.trim().slice(0,500),expected:$('retryExpected').value.trim().slice(0,500),before:$('retryBefore').value.trim().slice(0,500),after:$('retryAfter').value.trim().slice(0,500),status:$('retryStatus').value==='resolved'?'resolved':'retry'}}
function buildRetryPrompt(i){const r=retryInputs();if(r.problem.length<5||r.expected.length<5){$('retryMessage').textContent='문제와 원하는 정상 동작을 각각 5자 이상 입력해 주세요.';return}const v=['기존 기능과 사용자 데이터는 유지하면서 아래 문제만 최소 범위로 수정해 줘.','프로젝트: '+userProject(),'퀘스트 '+(i+1)+': '+TOPICS[data.type][i],'현재 문제: '+r.problem,'기대 동작: '+r.expected,r.before?'재현 과정: '+r.before:'','1. 원인을 확인할 최소 점검 순서를 알려줘.','2. 수정 방법과 변경 범위를 제시해 줘.','3. 모바일과 PC에서 정상·오류 상황을 다시 확인할 테스트 절차를 알려줘.','4. 해결되지 않았으면 해결된 것으로 단정하지 말아줘.'].filter(Boolean).join('\n');$('retryPrompt').value=v;$('retryMessage').textContent='요청문을 만들었습니다. 내용을 선택해 AI 개발 도구에 붙여넣으세요.'}
function saveRetry(i){const r=retryInputs();if(r.problem.length<5||r.expected.length<5){$('retryMessage').textContent='문제와 기대 동작을 각각 5자 이상 입력해 주세요.';return}if(r.status==='resolved'&&r.after.length<8){$('retryMessage').textContent='해결 상태로 저장하려면 수정 후 직접 확인한 결과를 8자 이상 기록해 주세요.';return}const previous=cleanRetryLogs(data.retryLogs);const next=cleanRetryLogs(data.retryLogs);next[i]=[...(next[i]||[]),r].slice(-5);data.retryLogs=next;if(!save()){data.retryLogs=previous;$('retryMessage').textContent='저장에 실패했습니다. 기존 기록은 유지됩니다.';return}quest(i)}
function quest(i){data.current=i;save();const title=TOPICS[data.type][i],prompt=suggestedPrompt(i),checks=CHECKS[i],record=data.evidence[i]||'',note=data.notes[i]||'',checked=data.criteria[i]||[];layout(`<button class="btn ghost" onclick="dashboard()">← 내 로드맵</button><span class="tag" style="margin-left:8px">QUEST ${i+1} / 7</span><h1>${esc(title)}</h1><p class="muted">프로젝트: ${esc(userProject())}</p><div class="questgrid"><div class="card"><h3>① 이번 단계에서 할 일</h3><p class="muted">${esc(title)}. AI에게 요청하기 전에 실제로 확인할 결과물을 생각해 보세요.</p>${practiceMarkup(i)}${starterPracticeMarkup(i)}${lessonMarkup(i)}<div class="lesson"><strong>초보자 실습 가이드</strong><p class="note">1. AI 개발 도구를 엽니다. 2. 아래 프롬프트를 복사해 붙여넣습니다. 3. 생성된 결과를 실행하고 눈으로 확인합니다. 4. 원하는 모습이 아니라면 어떤 점을 고쳐야 하는지 구체적으로 다시 요청합니다.</p><p class="note"><strong>완료 기준:</strong> 이번 단계의 결과가 직접 실행되고, 아래 점검 항목을 통과해야 합니다.</p></div><h3>② AI에게 요청하기</h3><div class="prompt" id="prompt">${esc(prompt)}</div><button class="btn secondary" style="margin-top:14px" onclick="copyPrompt()">프롬프트 복사</button><p class="note">프롬프트를 ChatGPT, Cursor, Claude Code 등 사용 중인 개발 도구에 붙여 넣고 실행해 보세요.</p><h3>③ AI 학습 코치에게 질문하기</h3><textarea id="aiQuestion" class="ask" placeholder="예: 모바일에서 메뉴가 겹쳐요. 어떻게 AI에게 수정 요청해야 하나요?"></textarea><div class="airow"><button class="btn secondary" id="coachBtn" onclick="askCoach(${i})">AI 코치에게 질문</button></div><div id="aiCoach" class="aiout" style="display:none"></div>${guideMarkup(i)}<h3>이전 질문·답변</h3><div id="aiHistory">${renderHistory(i)}</div>${retryMarkup(i)}<h3>④ 시행착오 기록</h3><label class="field" for="memo">어떤 문제를 해결했나요?</label><textarea id="memo" oninput="autosaveDraft(${i})" placeholder="예: 모바일에서 메뉴가 겹쳐서 다시 수정 요청했어요.">${esc(note)}</textarea><button class="btn ghost" onclick="saveQuest(${i})">기록 저장</button></div><div class="card"><h3>⑤ 실제 결과물 확인</h3><p class="note">테스트는 실제 프로젝트에서 진행해야 합니다. 완료 체크만으로 기능 검증이 끝나지는 않습니다.</p><p class="muted">각 항목은 직접 실행한 뒤 확인해야 합니다.</p>${checks.map((c,j)=>`<label class="check"><input class="verify" type="checkbox" onchange="autosaveDraft(${i})" ${checked[j]?'checked':''}><span>${esc(c)}</span></label>`).join('')}<label class="field" for="result">결과물 URL 또는 작업 증빙</label><input id="result" oninput="autosaveDraft(${i})" value="${esc(record)}" placeholder="https://... 또는 완료한 파일·작업 위치"><p class="note">배포 URL을 입력하면 형식과 접속 가능 여부를 확인할 수 있습니다. 브라우저 제한으로 일부 사이트는 접속 확인이 불가능할 수 있습니다.</p><div class="quick-actions"><button class="btn ghost" onclick="checkUrl()">URL 접속 시도</button><button class="btn secondary" onclick="openResult()">내 결과물 열기 ↗</button></div><div class="verifybox" id="urlStatus" role="status">아직 확인하지 않았습니다.</div>${qaMarkup(i)}${completionMarkup(i)}<div class="feedback" id="feedback" role="status" aria-live="polite">세 가지 확인 항목과 실제 작업 증빙을 기록하면 다음 단계로 이동할 수 있습니다.</div><div class="controls"><button class="btn secondary" onclick="saveQuest(${i})">진행 저장</button><button class="btn" onclick="finish(${i})">완료하고 다음 →</button></div><div class="quest-nav" aria-label="퀘스트 이동"><button class="btn ghost" onclick="goQuest(${i-1})" ${i===0?'disabled':''}>← 이전 퀘스트</button><span class="note">${i+1} / 7단계</span><button class="btn ghost" onclick="goQuest(${i+1})" ${i===6?'disabled':''}>다음 퀘스트 →</button></div></div></div>`)}
function goQuest(i){if(i<0||i>6)return;if($('result')&&$('memo')){autosaveDraft(data.current);if(!save())return}quest(i)}
function autosaveDraft(i){if(!$('result')||!$('memo'))return;data.evidence[i]=$('result').value.trim();data.notes[i]=$('memo').value;data.criteria[i]=[...document.querySelectorAll('.verify')].map(e=>e.checked);save();updateCompletion(i)}
function saveQuest(i){data.evidence[i]=$('result').value.trim();data.notes[i]=$('memo').value.trim();data.criteria[i]=[...document.querySelectorAll('.verify')].map(e=>e.checked);const saved=save();if(saved)$('feedback').textContent='현재 브라우저에 학습 기록을 저장했습니다.';return saved}
function copyPrompt(){navigator.clipboard.writeText($('prompt').innerText).then(()=>alert('프롬프트를 복사했습니다.')).catch(()=>alert('복사에 실패했습니다. 직접 선택해 복사해 주세요.'))}
function finish(i){if(!saveQuest(i))return;if(!data.quizPassed?.[i]){$('feedback').textContent='먼저 이해도 확인 문제를 풀어 주세요.';return}if(!Array.isArray(data.criteria[i])||data.criteria[i].some(x=>!x)||data.criteria[i].length!==3){$('feedback').textContent='실제 실행 후 세 가지 확인 항목을 모두 체크해 주세요.';return}if((data.evidence[i]||'').length<8){$('feedback').textContent='결과물 URL이나 검증한 작업 내용을 8자 이상 입력해 주세요.';return}data.done[i]=true;if(!save()){data.done[i]=false;return}if(i===6){layout('<div class="card" style="text-align:center;padding:45px"><h1>🎉 실전 7단계 완주!</h1><p class="muted">학습 기록이 저장됐습니다. 실제 기능과 배포는 스스로 확인한 결과이며 플랫폼에서 자동 검증한 것은 아닙니다.</p><button class="btn" onclick="dashboard()">내 결과 확인하기</button></div>')}else quest(i+1)}
function exportPlan(){const lines=['VIBE QUEST 학습 계획','프로젝트: '+userProject(),'유형: '+TYPES[data.type][1],'최소 기능: '+projectPlan().join(' / '),'',...TOPICS[data.type].map((t,i)=>`${i+1}. ${t} [${data.done[i]?'완료':'진행 전'}]\n   결과: ${data.evidence[i]||'-'}\n   메모: ${data.notes[i]||'-'}`)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vibe-quest-learning-plan.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

async function aiRequest(mode,question,stage,buttonId,boxId){const button=$(buttonId),output=$(boxId);button.disabled=true;button.classList.add('spinner');output.style.display='block';output.textContent='AI에게 요청 중입니다…';try{const response=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,question,stage,project:userProject(),type:TYPES[data.type][1],level:data.experience,features:projectPlan()})});const result=await response.json();output.textContent=result.answer||result.error||'응답을 확인할 수 없습니다.';if(result.answer){if(mode==='roadmap')data.aiPlan=result.answer;else{data.aiHistory=data.aiHistory||{};const key=String(data.current);data.aiHistory[key]=data.aiHistory[key]||[];data.aiHistory[key].push({question,answer:result.answer});data.aiHistory[key]=data.aiHistory[key].slice(-12);if($('aiHistory'))$('aiHistory').innerHTML=renderHistory(data.current)}save()}}catch(e){output.textContent='네트워크 연결을 확인해 주세요. 기본 실습은 계속 가능합니다.'}finally{button.disabled=false;button.classList.remove('spinner')}}
function renderHistory(i){const items=(data.aiHistory||{})[i]||[];return items.length?items.map(x=>'<div class="aiout"><strong>질문:</strong> '+esc(x.question)+'<hr><strong>AI 답변:</strong> '+esc(x.answer)+'</div>').join(''):'<p class="note">아직 질문 기록이 없습니다.</p>'}
function makeAIPlan(){aiRequest('roadmap','',null,'roadmapBtn','aiPlan')}
function askCoach(i){const q=$('aiQuestion').value.trim();if(q.length<5){$('aiCoach').style.display='block';$('aiCoach').textContent='궁금한 점을 5자 이상 적어 주세요.';return}aiRequest('coach',q,TOPICS[data.type][i],'coachBtn','aiCoach')}

function downloadFile(name,content,type){const blob=new Blob([content],{type});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupData(){archiveCurrent();const payload={format:'vibequest-backup',version:1,exportedAt:new Date().toISOString(),data};try{downloadFile('vibe-quest-backup.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');save()}catch(err){console.error('백업 다운로드 실패',err);const status=$('restoreStatus');if(status)status.textContent='백업 파일을 생성하지 못했습니다. 브라우저 다운로드 설정을 확인해 주세요.'}}
function showBackup(){layout('<button class="btn ghost" onclick="dashboard()">← 내 학습</button><h1>학습 기록 백업·복원</h1><div class="card"><h3>내 기록을 파일로 보관하기</h3><p class="muted">프로젝트 목표, 퀘스트 진행도, 실습 증빙과 메모, AI 질문 기록을 JSON 파일로 저장합니다. 다른 브라우저에서도 파일을 가져와 이어서 학습할 수 있습니다.</p><div class="backup-actions"><button class="btn" onclick="backupData()">백업 파일 다운로드</button><button class="btn secondary" onclick="document.getElementById(\'backupFile\').click()">기록 파일 불러오기</button></div><input class="backup-input" id="backupFile" type="file" accept=".json,application/json" onchange="restoreFile(this)"><p class="notice">복원하면 현재 브라우저의 학습 기록이 교체됩니다. 먼저 현재 기록을 백업하세요. 파일 안에는 사용자가 작성한 프로젝트 설명과 메모가 포함됩니다.</p><p class="note" id="restoreStatus"></p></div>')}
async function restoreFile(input){const file=input.files?.[0];if(!file)return;const status=$('restoreStatus');if(file.size>2000000){status.textContent='백업 파일은 2MB 이하만 불러올 수 있습니다.';input.value='';return}try{const obj=JSON.parse(await file.text());const d=obj?.data;const validProject=p=>p&&typeof p==='object'&&!Array.isArray(p)&&Object.hasOwn(TYPES,p.type)&&typeof p.description==='string'&&p.description.length<=1200&&Array.isArray(p.done)&&p.done.length<=7;if(obj.format!=='vibequest-backup'||obj.version!==1||!validProject(d)||!Array.isArray(d.projects||[])||(d.projects||[]).length>30||!(d.projects||[]).every(validProject))throw Error('invalid');if(!confirm('현재 브라우저의 학습 기록을 백업 파일 내용으로 교체할까요?'))return;const clean=p=>({type:p.type,experience:String(p.experience||'none'),tool:String(p.tool||'recommend'),description:p.description,done:p.done.map(Boolean),evidence:p.evidence&&typeof p.evidence==='object'&&!Array.isArray(p.evidence)?p.evidence:{},notes:p.notes&&typeof p.notes==='object'&&!Array.isArray(p.notes)?p.notes:{},criteria:p.criteria&&typeof p.criteria==='object'&&!Array.isArray(p.criteria)?p.criteria:{},aiHistory:p.aiHistory&&typeof p.aiHistory==='object'&&!Array.isArray(p.aiHistory)?p.aiHistory:{},aiPlan:String(p.aiPlan||''),quizPassed:p.quizPassed&&typeof p.quizPassed==='object'&&!Array.isArray(p.quizPassed)?p.quizPassed:{},qa:p.qa&&typeof p.qa==='object'&&!Array.isArray(p.qa)?p.qa:{},activeId:String(p.activeId||'legacy'),goalReviews:cleanGoalReviews(p.goalReviews),retryLogs:cleanRetryLogs(p.retryLogs)});const previous=data;const restored={...clean(d),step:0,projects:(d.projects||[]).map(clean)};try{localStorage.setItem('vibequest-v1',JSON.stringify(restored))}catch(e){status.textContent='저장 공간이 부족해 복원하지 못했습니다. 기존 기록은 유지됩니다.';return}data=restored;dashboard();alert('학습 기록을 복원했습니다.')}catch(e){status.textContent='올바른 VIBE QUEST 백업 파일인지 확인해 주세요.'}finally{input.value=''}}
function snapshot(){return {type:data.type,description:data.description,experience:data.experience,tool:data.tool,done:[...data.done],evidence:{...data.evidence},notes:{...data.notes},criteria:{...data.criteria},aiHistory:{...data.aiHistory},aiPlan:data.aiPlan||'',quizPassed:{...(data.quizPassed||{})},qa:{...(data.qa||{})},goalReviews:cleanGoalReviews(data.goalReviews),retryLogs:cleanRetryLogs(data.retryLogs),activeId:data.activeId||'legacy',current:Number.isInteger(data.current)?Math.max(0,Math.min(6,data.current)):null}}
function archiveCurrent(){data.projects=Array.isArray(data.projects)?data.projects:[];if(!data.activeId)data.activeId='legacy';const x=snapshot();const index=data.projects.findIndex(p=>p.activeId===x.activeId);if(index>=0)data.projects[index]=x;else data.projects.push(x)}
function projectsPage(){if(data.description||data.done.some(Boolean)||Object.keys(data.evidence||{}).length||Object.keys(data.notes||{}).length||(data.projects||[]).some(p=>p.activeId===data.activeId))archiveCurrent();save();const items=data.projects||[];const completed=items.filter(p=>(p.done||[]).slice(0,7).filter(Boolean).length===7).length;layout('<h1>내 프로젝트</h1><p class="muted">프로젝트별 학습 기록을 독립적으로 관리합니다. 새 프로젝트로 이동해도 기존 진행도가 유지됩니다.</p><div class="project-overview" aria-label="프로젝트 학습 현황"><span><strong>'+items.length+'</strong>개 프로젝트</span><span><strong>'+completed+'</strong>개 7단계 완주</span></div><button class="btn" onclick="start()">+ 새 프로젝트 만들기</button><div class="card" style="margin-top:18px">'+(items.length?items.map((p,i)=>{const n=(p.done||[]).slice(0,7).filter(Boolean).length;const name=esc(p.description||TYPES[p.type]?.[1]||'내 프로젝트');return '<div class="project-item"><strong>'+name+'</strong><p class="status">'+n+'/7단계 완료 · '+esc(TYPES[p.type]?.[1]||'기타')+'</p><div class="project-progress" role="progressbar" aria-label="'+name+' 학습 완료 단계" aria-valuemin="0" aria-valuemax="7" aria-valuenow="'+n+'"><span style="width:'+(n/7*100)+'%"></span></div><p class="note">'+(n===7?'7단계 완주 · 학습 기록 다시 확인하기':n===0?'학습을 시작해 보세요':'다음 목표: '+esc(TOPICS[p.type]?.[(Number.isInteger(p.current)&&p.current>=0&&p.current<7&&!p.done?.[p.current]?p.current:Array.from({length:7},(_,j)=>!!p.done?.[j]).findIndex(v=>!v))]||'다음 퀘스트'))+'</p><button class="btn secondary" onclick="openProject('+i+')">학습 이어가기</button></div>'}).join(''):'<p class="muted">아직 저장된 프로젝트가 없습니다. 새 프로젝트를 만들어 첫 퀘스트를 시작해 보세요.</p>')+'</div>')}
function openProject(i){archiveCurrent();const p=data.projects?.[i];if(!p)return;const projects=data.projects;Object.assign(data,{...p,projects,step:0});data.quizPassed={...(p.quizPassed||{})};data.qa={...(p.qa||{})};data.goalReviews=cleanGoalReviews(p.goalReviews);data.retryLogs=cleanRetryLogs(p.retryLogs);data.current=Number.isInteger(p.current)&&p.current>=0&&p.current<=6?p.current:null;save();dashboard()}
async function checkUrl(){const v=$('result').value.trim(),status=$('urlStatus');let url;try{url=new URL(v);if(!['http:','https:'].includes(url.protocol))throw Error('scheme')}catch{status.textContent='http:// 또는 https://로 시작하는 유효한 URL을 입력해 주세요.';return}status.textContent='접속 상태를 확인하는 중입니다…';try{await fetch(url.href,{mode:'no-cors',cache:'no-store',signal:AbortSignal.timeout(6000)});status.textContent='브라우저에서 요청을 보냈습니다. 실제 페이지의 표시·기능 정상 여부는 직접 열어 확인해야 합니다.'}catch{status.textContent='접속 확인에 실패했거나 브라우저 보안 정책으로 차단되었습니다. 주소를 새 탭에서 직접 확인해 주세요.'}}

function lessonMarkup(i){const l=LESSON_LIBRARY[i];return '<div class="lesson-detail"><strong>이번 퀘스트에서 배울 것</strong><p>'+esc(l.intro)+'</p><ol>'+l.actions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ol><p>💡 '+esc(l.tip)+'</p></div><div class="lesson-detail"><strong>이해도 확인 · 1문제</strong><p>'+esc(l.question)+'</p>'+l.answers.map((a,j)=>'<button type="button" class="quiz-option" onclick="answerQuiz('+i+','+j+')">'+esc(a)+'</button>').join('')+'<div class="quiz-feedback" id="quizFeedback" role="status" aria-live="polite">'+(data.quizPassed?.[i]?'✅ 이해도 확인 완료':'정답을 선택해 보세요.')+'</div></div>'}
