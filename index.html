<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIBE QUEST — 나만의 프로젝트를 완성하는 배움</title><style>
:root{font-family:Inter,system-ui,'Noto Sans KR',sans-serif;color:#20213d;background:#f7f8fd}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:white;box-shadow:0 1px 12px #24255512;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,5vw,76px);position:sticky;top:0;z-index:4}.logo{font-size:20px;font-weight:900;color:#6551f4}nav{display:flex;gap:10px}.btn{background:#6651f6;color:white;border:0;padding:12px 19px;border-radius:12px;font-weight:800}.btn.secondary{background:#eeebff;color:#5746dc}.btn.ghost{background:white;border:1px solid #dedcf2;color:#5c54aa}.wrap{max-width:1180px;margin:auto;padding:40px 24px}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;min-height:420px}.hero h1{font-size:clamp(34px,4.5vw,56px);line-height:1.25;margin:12px 0}.hero p,.muted{color:#797992;line-height:1.75}.art{min-height:340px;border-radius:32px;background:linear-gradient(145deg,#e9e1ff,#faf5ff);display:grid;place-items:center;font-size:100px}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.tile,.card{background:white;border:1px solid #ebeaf3;border-radius:18px;padding:22px}.tile{text-align:center;font-weight:700}.tile span{display:block;font-size:32px;margin-bottom:12px}.panel{max-width:760px;background:#fff;margin:25px auto;padding:36px;border:1px solid #e9e8f4;border-radius:26px;box-shadow:0 14px 50px #34335c0c}.heading{font-size:28px;margin:8px 0 12px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:24px 0}.choice{padding:19px;text-align:left;border:2px solid #ebeaf5;background:white;border-radius:16px;min-height:94px}.choice.active{border-color:#6651f6;background:#f5f2ff}.choice strong{display:block;margin-bottom:6px}.choice small{color:#86869d}.bar{height:7px;border-radius:6px;background:#eeeefa;overflow:hidden;margin-bottom:24px}.fill{height:100%;background:#6c55f7;transition:width .2s}textarea,input{width:100%;border:1px solid #dcdceb;border-radius:12px;padding:14px;outline-color:#6c55f7}textarea{min-height:115px;resize:vertical}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.shell{display:grid;grid-template-columns:225px 1fr;gap:26px}.side{padding:18px;background:white;border-radius:20px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent;padding:14px;border:0;border-radius:10px;color:#595777}.side button:hover,.side button.active{background:#f0edff;color:#5945e9}.steps{display:grid;gap:12px}.step{border:1px solid #eceaf4;background:white;border-radius:15px;padding:20px;display:flex;gap:17px;align-items:center;text-align:left;width:100%}.num{display:grid;place-items:center;width:40px;height:40px;border-radius:100%;background:#ede9ff;color:#6049f4;font-weight:900;flex-shrink:0}.progress{font-size:13px;color:#787892}.tag{background:#efecff;color:#6856e8;border-radius:50px;padding:6px 12px;font-size:12px;font-weight:700}.questgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.prompt{background:#f6f5ff;border-radius:15px;padding:20px;line-height:1.75;white-space:pre-wrap}.check{display:flex;align-items:center;gap:9px;margin:15px 0}.check input{width:auto}.hidden{display:none!important}footer{text-align:center;padding:30px;color:#9996af;font-size:13px}@media(max-width:740px){.hero,.shell,.questgrid{grid-template-columns:1fr}.hero{min-height:auto}.art{min-height:190px;font-size:70px}.tiles{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:1fr}.panel{padding:22px}.wrap{padding:24px 14px}nav{gap:5px}nav button{padding:9px!important;font-size:12px}}
.milestones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.milestone{background:#f7f5ff;border-radius:13px;padding:13px;font-size:12px}.milestone b{display:block;margin-bottom:6px}.field{display:block;margin:12px 0 6px;font-weight:700}.note{font-size:12px;color:#77738e;line-height:1.6}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:6px 11px;background:#f1edff;color:#5b4ae1;font-size:12px}.evidence{margin:12px 0}.feedback{border-left:3px solid #7665ea;background:#f6f4ff;padding:12px;border-radius:9px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{width:100%}@media(max-width:740px){.milestones,.split{grid-template-columns:1fr}} .aiout{white-space:pre-wrap;line-height:1.75;background:#f8f7ff;border:1px solid #e7e1ff;border-radius:14px;padding:18px;margin-top:12px;font-size:14px}.airow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.ask{min-height:95px}.spinner{opacity:.7;pointer-events:none}.backup-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.notice{background:#f2f0ff;padding:14px;border-radius:13px;color:#62578e;font-size:13px;line-height:1.6}.backup-input{display:none}.lesson{background:#faf9ff;border:1px solid #e8e4ff;padding:16px;border-radius:14px;margin:12px 0}.project-item{padding:15px;margin:9px 0;border:1px solid #ece9fa;border-radius:12px}.project-item button{margin-left:8px}.status{font-size:13px;color:#696682}.verifybox{margin-top:12px;padding:12px;background:#f5f4ff;border-radius:10px}@media(max-width:740px){.project-item button{margin:5px 0}}.lesson-detail{border-left:3px solid #7764f7;padding:12px 16px;background:#f7f6ff;border-radius:12px;margin:14px 0}.lesson-detail ol{padding-left:19px;line-height:1.9}.lesson-detail p{font-size:13px;color:#6e688a}.quiz-option{display:block;text-align:left;width:100%;border:1px solid #dedbf3;border-radius:11px;background:white;padding:12px;margin:8px 0}.quiz-option:hover{border-color:#7764f7}.quiz-feedback{font-size:13px;line-height:1.6;margin-top:10px}.track-guide{padding:16px;border-radius:15px;background:#f2efff;border:1px solid #e1dbff;margin:15px 0}.track-guide strong{color:#5946d9}.track-guide p{margin:8px 0;font-size:14px;line-height:1.75}.qa-row{padding:11px 0;border-bottom:1px solid #eceaf6}.qa-row:last-child{border-bottom:0}.qa-row input{width:auto}.qa-summary{font-weight:700;color:#6150d9;margin-top:12px}.questgrid>.card{min-width:0}@media(min-width:900px){.questgrid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}@media(max-width:740px){header{padding:12px 14px}.hero h1{font-size:32px}.card{padding:17px}.shell{gap:15px}.side{display:flex;gap:4px;overflow-x:auto;padding:8px}.side .logo{display:none}.side button{white-space:nowrap;width:auto;font-size:12px}}.hero{background:linear-gradient(115deg,#fff,#f3efff);border-radius:28px;padding:32px;min-height:390px}.card,.panel,.tile{box-shadow:0 8px 24px rgba(69,50,134,.045)}.step:hover,.choice:hover{border-color:#9c8bff;transform:translateY(-1px)}.step,.choice{transition:.18s}.lesson-detail{line-height:1.7}.focus-banner{padding:16px 20px;background:linear-gradient(110deg,#ece8ff,#faf8ff);border:1px solid #ded7ff;border-radius:16px;margin:18px 0}.focus-banner p{margin:5px 0;color:#686187}.quick-actions{display:flex;flex-wrap:wrap;gap:9px;margin:13px 0}.kbd{font-family:monospace;background:#f4f1ff;padding:2px 6px;border-radius:5px}.steps .step:focus-visible,.btn:focus-visible{outline:3px solid #9f91ff;outline-offset:3px}@media(max-width:740px){.hero{padding:24px 18px}.hero .art{min-height:160px}.steps .step{padding:14px}.controls{flex-wrap:wrap}}</style></head><body><header><div class="logo">💜 VIBE QUEST</div><nav><button class="btn secondary" onclick="page('home')">홈</button><button class="btn secondary" onclick="page('dashboard')">내 학습</button><button class="btn" onclick="start()">시작하기 →</button></nav></header><main id="root"></main><footer>VIBE QUEST · AI로 배우고, 직접 만들고, 실제로 완성하세요.</footer><script>
const TYPES={web:['🌐','웹사이트','포트폴리오·회사소개·랜딩 페이지'],app:['📱','웹앱·모바일 앱','할 일·예약·일상 서비스'],game:['🎮','게임','퍼즐·캐주얼 게임'],auto:['🤖','AI 도구·자동화','반복 업무와 AI 비서'],general:['🧭','범용 학습','만들 것을 아직 정하지 못했어요']};
const TOPICS={web:['프로젝트 목표·페이지 구성 정리','AI 개발 도구로 첫 화면 만들기','콘텐츠와 디자인 적용','모바일 반응형 개선','버튼과 문의 폼 구현','직접 테스트하고 버그 수정','웹사이트 배포와 재수정'],app:['사용자 문제와 핵심 기능 정리','AI로 첫 앱 화면 생성','화면 사이 이동 구현','입력 폼과 상태 연결','데이터 저장 구현','기능 테스트와 오류 해결','웹앱 배포 및 모바일 확인'],game:['게임 규칙과 승리 조건 기획','AI로 플레이 가능한 첫 화면 제작','캐릭터·입력·상태 구현','점수와 게임 진행 만들기','게임 종료와 재시작 구현','밸런스·버그 테스트','브라우저 게임 배포'],auto:['반복 업무 분석과 절차 정의','입력·출력 형식 설계','AI 도구로 처리 흐름 제작','샘플 데이터로 실행','오류 처리와 예외 상황 정의','자동화 결과 검증','실제 업무에 연결'],general:['바이브 코딩 도구 알아보기','AI에 명확히 요청하기','간단한 웹페이지 만들기','버튼 기능 직접 수정하기','저장과 데이터 흐름 체험','버그 분석과 수정하기','웹에 결과물 공개하기']};
const $=x=>document.getElementById(x);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data;try{data=JSON.parse(localStorage.getItem('vibequest-v1'))||{}}catch{data={}};data={type:'web',experience:'none',tool:'recommend',description:'',step:0,done:[],evidence:{},notes:{},criteria:{},aiHistory:{},projects:[],quizPassed:{},...data};const save=()=>localStorage.setItem('vibequest-v1',JSON.stringify(data));const root=()=>$('root');
function page(p){if(p==='home')return home();if(p==='onboard')return onboard();if(p==='quest')return quest(data.current||0);dashboard()}
function home(){root().innerHTML='<div class="wrap"><section class="hero"><div><span class="tag">AI와 함께하는 실전 프로젝트 학습</span><h1>아이디어만 있으면,<br>당신도 만들 수 있어요.</h1><p>코딩을 몰라도 괜찮아요. 만들고 싶은 프로젝트를 정하면 AI와 함께 기획부터 제작·테스트·배포까지 직접 경험합니다.</p><button class="btn" onclick="start()">지금 시작하기 →</button></div><div class="art">👩🏻‍💻 ✨</div></section><section class="tiles">'+Object.entries(TYPES).map(([k,v])=>'<div class="tile"><span>'+v[0]+'</span>'+v[1]+'</div>').join('')+'</section></div>'}
function start(){if(data.activeId||data.done.some(Boolean)||data.description||Object.keys(data.evidence||{}).length)archiveCurrent();data.activeId='project-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);data.type='web';data.description='';data.experience='none';data.tool='recommend';data.done=[];data.evidence={};data.notes={};data.criteria={};data.aiPlan='';data.aiHistory={};data.quizPassed={};data.step=0;save();onboard()}
function onboard(){const s=data.step;const titles=['무엇을 만들어 보고 싶나요?','어떤 프로젝트를 생각하고 있나요?','개발 경험은 어느 정도인가요?','사용할 AI 도구가 있나요?'];const choices=s===0?Object.entries(TYPES).map(([key,v])=>[key,v[0]+' '+v[1],v[2]]):s===2?[['none','처음이에요','개발·바이브 코딩 경험 없음'],['ai','AI를 사용해 봤어요','ChatGPT 등과 대화 경험'],['try','프로젝트를 만든 적 있어요','AI로 간단한 제작 경험'],['deploy','배포까지 해봤어요','직접 수정·배포 경험']]:[['recommend','잘 모르겠어요','추천 도구로 시작하기'],['chatgpt','ChatGPT','대화형 AI'],['cursor','Cursor','AI 코드 에디터'],['claude','Claude Code','AI 개발 에이전트'],['other','다른 도구','원하는 도구 사용']];const selected=s===0?data.type:s===2?data.experience:data.tool;root().innerHTML='<div class="wrap"><div class="panel"><div class="bar"><div class="fill" style="width:'+((s+1)*25)+'%"></div></div><span class="tag">STEP '+(s+1)+' / 4</span><h2 class="heading">'+titles[s]+'</h2><p class="muted">잘 몰라도 괜찮아요. 나중에 언제든 변경할 수 있습니다.</p>'+(s===1?'<textarea id="idea" placeholder="예: 내 작품을 전시하는 포트폴리오 웹사이트를 만들고 싶어요.">'+esc(data.description)+'</textarea><p class="muted">비워두면 추천 예제로 진행합니다.</p>':'<div class="options">'+choices.map(([k,t,d])=>'<button class="choice '+(selected===k?'active':'')+'" onclick="pick(\''+k+'\')"><strong>'+t+'</strong><small>'+d+'</small></button>').join('')+'</div>')+'<div class="controls"><button class="btn ghost" onclick="back()">← 이전</button><button class="btn" onclick="next()">'+(s===3?'맞춤 로드맵 만들기 →':'다음 →')+'</button></div></div></div>'}
function pick(k){data[data.step===0?'type':data.step===2?'experience':'tool']=k;save();onboard()}function back(){if(data.step>0){data.step--;save();onboard()}else home()}function next(){if(data.step===1)data.description=$('idea').value.trim();if(data.step<3){data.step++;save();onboard()}else{archiveCurrent();save();dashboard()}}
function layout(content){root().innerHTML='<div class="wrap shell"><aside class="side"><div class="logo">학습 메뉴</div><button onclick="home()">⌂ 홈</button><button class="active" onclick="dashboard()">▣ 내 학습 로드맵</button><button onclick="projectsPage()">▤ 프로젝트 관리</button><button onclick="start()">⊕ 새 프로젝트 시작</button><button onclick="showBackup()">⇩ 학습 기록 백업·복원</button></aside><div>'+content+'</div></div>'}

const CHECKS=[
['목표 사용자가 누구인지 명확히 설명할 수 있나요?','첫 버전에 반드시 필요한 기능 3개를 정했나요?','이번 작업에서 제외할 기능을 정했나요?'],
['요청문에 결과물과 화면 목적이 포함되어 있나요?','AI가 만든 화면을 직접 열어 봤나요?','한 가지 개선을 다시 요청했나요?'],
['프로젝트에 맞는 콘텐츠 또는 데이터를 넣었나요?','이미지·텍스트가 깨지지 않나요?','변경 전후 화면을 비교했나요?'],
['휴대전화 너비에서 확인했나요?','글자가 잘리거나 버튼이 겹치지 않나요?','터치 조작이 가능한가요?'],
['버튼 또는 폼의 기대 동작을 명시했나요?','정상 입력으로 동작을 테스트했나요?','빈 값 또는 잘못된 입력도 확인했나요?'],
['오류를 재현할 수 있나요?','AI에게 재현 절차와 기대 결과를 전달했나요?','수정 후 기존 기능도 재검사했나요?'],
['공개 배포 주소를 직접 열어 봤나요?','모바일과 PC에서 접속할 수 있나요?','간단한 수정 후 다시 배포했나요?']];
const STEPS={
web:['사이트 구조','디자인 적용','공개 주소'],app:['핵심 화면','작동 기능','사용 가능한 웹앱'],game:['게임 플레이','게임 규칙','공유 가능한 게임'],auto:['업무 분석','자동 실행','처리 결과'],general:['첫 페이지','실습 응용','작은 프로젝트 완성']};
function userProject(){return data.description.trim()||TYPES[data.type][1]+' 첫 프로젝트'}
function projectPlan(){const desc=data.description.toLowerCase();const words=desc.includes('포트폴리오')?['자기소개','작업물 목록','연락하기']:desc.includes('예약')?['예약 정보 입력','예약 확인','예약 목록']:desc.includes('쇼핑')||desc.includes('상품')?['상품 목록','상세 화면','문의 기능']:desc.includes('게임')||data.type==='game'?['게임 시작','진행 및 점수','다시하기']:desc.includes('일정')||desc.includes('할 일')?['일정 입력','목록 보기','완료 처리']:STEPS[data.type];return words;}
function dashboard(){const t=TYPES[data.type],done=data.done.filter(Boolean).length,features=projectPlan();layout(`<span class="tag">내 목표에 맞춘 실전 학습</span><h1>${t[0]} ${t[1]} 프로젝트</h1><p class="muted">${esc(userProject())}</p><div class="card"><strong>프로젝트 MVP 범위</strong><p class="muted">목표에 맞게 먼저 만들 최소 기능 3가지를 제안합니다. AI가 실시간 생성한 결과는 아니며, 프로젝트 키워드 기반의 시작 템플릿입니다.</p><div class="milestones">${features.map((v,i)=>`<div class="milestone"><b>기능 ${i+1}</b>${esc(v)}</div>`).join('')}</div><div class="split"><button class="btn secondary" onclick="exportPlan()">학습 계획 파일 저장 ↓</button><button class="btn ghost" onclick="showBackup()">전체 기록 백업·복원</button></div></div><div class="card" style="margin-top:16px"><h3>✨ AI 맞춤형 로드맵 코치</h3><p class="muted">프로젝트 목표를 바탕으로 실제 AI가 MVP 범위와 7단계 작업을 자세히 제안합니다. AI 연결이 없으면 기본 로드맵은 그대로 사용할 수 있습니다.</p><button class="btn" id="roadmapBtn" onclick="makeAIPlan()">AI 로드맵 생성</button><div id="aiPlan" class="aiout" style="display:${data.aiPlan?'block':'none'}">${esc(data.aiPlan||'')}</div></div><h2>학습 진행 현황</h2><div class="card"><span class="pill">완료 ${done} / 7 퀘스트</span><div class="bar" style="margin-top:15px"><div class="fill" style="width:${done/7*100}%"></div></div><p class="note">완료 판정은 현재 자기점검과 작업 기록 기반입니다. 자동 코드 QA 및 AI 평가는 추후 적용합니다.</p></div><div class="focus-banner"><strong>🎯 지금 할 일</strong><p>다음 퀘스트를 선택하고, AI 도구에서 실제 작업을 수행한 뒤 결과를 확인해 보세요.</p><button class="btn" onclick="quest(${Math.min(6,Math.max(0,data.done.findIndex(x=>!x)===-1?data.done.length:data.done.findIndex(x=>!x)))})">이어 학습하기 →</button></div><h2>나의 실전 퀘스트</h2><div class="steps">${TOPICS[data.type].map((q,i)=>`<button class="step" onclick="quest(${i})"><span class="num">${data.done[i]?'✓':i+1}</span><span><strong>${esc(q)}</strong><br><span class="progress">${data.done[i]?'완료 · 다시 보기':data.evidence[i]?'진행 기록 있음':'실습 시작하기'}</span></span></button>`).join('')}</div>`)}
function suggestedPrompt(i){const focus=TOPICS[data.type][i],difficulty=data.experience==='none'?'나는 코딩이 처음이라 용어를 쉽게 설명해줘.':'내가 선택한 개발 도구에 맞춰 안내해줘.';return `너는 바이브 코딩을 돕는 실전 개발 파트너야.
내 프로젝트: ${userProject()}
프로젝트 종류: ${TYPES[data.type][1]}
최소 기능: ${projectPlan().join(', ')}
이번 단계 (${i+1}/7): ${focus}
${difficulty}
완성된 전체 프로젝트를 한 번에 만들지 말고 이번 단계에서 필요한 가장 작은 작업만 제안해줘.
1) 먼저 확인할 사항은 최대 3개만 질문해줘.
2) 복사해서 실행할 작업 순서를 짧게 알려줘.
3) 작업 후 직접 확인할 기능 테스트와 실패 시 확인 방법을 알려줘.
4) 기존에 작동하던 기능은 유지하고, 변경한 부분을 설명해줘.`}
function quest(i){data.current=i;save();const title=TOPICS[data.type][i],prompt=suggestedPrompt(i),checks=CHECKS[i],record=data.evidence[i]||'',note=data.notes[i]||'',checked=data.criteria[i]||[];layout(`<button class="btn ghost" onclick="dashboard()">← 내 로드맵</button><span class="tag" style="margin-left:8px">QUEST ${i+1} / 7</span><h1>${esc(title)}</h1><p class="muted">프로젝트: ${esc(userProject())}</p><div class="questgrid"><div class="card"><h3>① 이번 단계에서 할 일</h3><p class="muted">${esc(title)}. AI에게 요청하기 전에 실제로 확인할 결과물을 생각해 보세요.</p>${practiceMarkup(i)}${lessonMarkup(i)}<div class="lesson"><strong>초보자 실습 가이드</strong><p class="note">1. AI 개발 도구를 엽니다. 2. 아래 프롬프트를 복사해 붙여넣습니다. 3. 생성된 결과를 실행하고 눈으로 확인합니다. 4. 원하는 모습이 아니라면 어떤 점을 고쳐야 하는지 구체적으로 다시 요청합니다.</p><p class="note"><strong>완료 기준:</strong> 이번 단계의 결과가 직접 실행되고, 아래 점검 항목을 통과해야 합니다.</p></div><h3>② AI에게 요청하기</h3><div class="prompt" id="prompt">${esc(prompt)}</div><button class="btn secondary" style="margin-top:14px" onclick="copyPrompt()">프롬프트 복사</button><p class="note">프롬프트를 ChatGPT, Cursor, Claude Code 등 사용 중인 개발 도구에 붙여 넣고 실행해 보세요.</p><h3>③ AI 학습 코치에게 질문하기</h3><textarea id="aiQuestion" class="ask" placeholder="예: 모바일에서 메뉴가 겹쳐요. 어떻게 AI에게 수정 요청해야 하나요?"></textarea><div class="airow"><button class="btn secondary" id="coachBtn" onclick="askCoach(${i})">AI 코치에게 질문</button></div><div id="aiCoach" class="aiout" style="display:none"></div><h3>이전 질문·답변</h3><div id="aiHistory">${renderHistory(i)}</div><h3>④ 시행착오 기록</h3><label class="field" for="memo">어떤 문제를 해결했나요?</label><textarea id="memo" placeholder="예: 모바일에서 메뉴가 겹쳐서 다시 수정 요청했어요.">${esc(note)}</textarea><button class="btn ghost" onclick="saveQuest(${i})">기록 저장</button></div><div class="card"><h3>⑤ 실제 결과물 확인</h3><p class="note">테스트는 실제 프로젝트에서 진행해야 합니다. 완료 체크만으로 기능 검증이 끝나지는 않습니다.</p><p class="muted">각 항목은 직접 실행한 뒤 확인해야 합니다.</p>${checks.map((c,j)=>`<label class="check"><input class="verify" type="checkbox" ${checked[j]?'checked':''}><span>${esc(c)}</span></label>`).join('')}<label class="field" for="result">결과물 URL 또는 작업 증빙</label><input id="result" value="${esc(record)}" placeholder="https://... 또는 완료한 파일·작업 위치"><p class="note">배포 URL을 입력하면 형식과 접속 가능 여부를 확인할 수 있습니다. 브라우저 제한으로 일부 사이트는 접속 확인이 불가능할 수 있습니다.</p><div class="quick-actions"><button class="btn ghost" onclick="checkUrl()">URL 접속 시도</button><button class="btn secondary" onclick="openResult()">내 결과물 열기 ↗</button></div><div class="verifybox" id="urlStatus" role="status">아직 확인하지 않았습니다.</div>${qaMarkup(i)}<div class="feedback" id="feedback">세 가지 확인 항목과 실제 작업 증빙을 기록하면 다음 단계로 이동할 수 있습니다.</div><div class="controls"><button class="btn secondary" onclick="saveQuest(${i})">진행 저장</button><button class="btn" onclick="finish(${i})">완료하고 다음 →</button></div></div></div>`)}
function saveQuest(i){data.evidence[i]=$('result').value.trim();data.notes[i]=$('memo').value.trim();data.criteria[i]=[...document.querySelectorAll('.verify')].map(e=>e.checked);save();$('feedback').textContent='현재 브라우저에 학습 기록을 저장했습니다.'}
function copyPrompt(){navigator.clipboard.writeText($('prompt').innerText).then(()=>alert('프롬프트를 복사했습니다.')).catch(()=>alert('복사에 실패했습니다. 직접 선택해 복사해 주세요.'))}
function finish(i){saveQuest(i);if(!data.quizPassed?.[i]){$('feedback').textContent='먼저 이해도 확인 문제를 풀어 주세요.';return}if(!Array.isArray(data.criteria[i])||data.criteria[i].some(x=>!x)||data.criteria[i].length!==3){$('feedback').textContent='실제 실행 후 세 가지 확인 항목을 모두 체크해 주세요.';return}if((data.evidence[i]||'').length<8){$('feedback').textContent='결과물 URL이나 검증한 작업 내용을 8자 이상 입력해 주세요.';return}data.done[i]=true;save();if(i===6){layout('<div class="card" style="text-align:center;padding:45px"><h1>🎉 실전 7단계 완주!</h1><p class="muted">학습 기록이 저장됐습니다. 실제 기능과 배포는 스스로 확인한 결과이며 플랫폼에서 자동 검증한 것은 아닙니다.</p><button class="btn" onclick="dashboard()">내 결과 확인하기</button></div>')}else quest(i+1)}
function exportPlan(){const lines=['VIBE QUEST 학습 계획','프로젝트: '+userProject(),'유형: '+TYPES[data.type][1],'최소 기능: '+projectPlan().join(' / '),'',...TOPICS[data.type].map((t,i)=>`${i+1}. ${t} [${data.done[i]?'완료':'진행 전'}]\n   결과: ${data.evidence[i]||'-'}\n   메모: ${data.notes[i]||'-'}`)];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vibe-quest-learning-plan.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

async function aiRequest(mode,question,stage,buttonId,boxId){const button=$(buttonId),output=$(boxId);button.disabled=true;button.classList.add('spinner');output.style.display='block';output.textContent='AI에게 요청 중입니다…';try{const response=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,question,stage,project:userProject(),type:TYPES[data.type][1],level:data.experience,features:projectPlan()})});const result=await response.json();output.textContent=result.answer||result.error||'응답을 확인할 수 없습니다.';if(result.answer){if(mode==='roadmap')data.aiPlan=result.answer;else{data.aiHistory=data.aiHistory||{};const key=String(data.current);data.aiHistory[key]=data.aiHistory[key]||[];data.aiHistory[key].push({question,answer:result.answer});data.aiHistory[key]=data.aiHistory[key].slice(-12);if($('aiHistory'))$('aiHistory').innerHTML=renderHistory(data.current)}save()}}catch(e){output.textContent='네트워크 연결을 확인해 주세요. 기본 실습은 계속 가능합니다.'}finally{button.disabled=false;button.classList.remove('spinner')}}
function renderHistory(i){const items=(data.aiHistory||{})[i]||[];return items.length?items.map(x=>'<div class="aiout"><strong>질문:</strong> '+esc(x.question)+'<hr><strong>AI 답변:</strong> '+esc(x.answer)+'</div>').join(''):'<p class="note">아직 질문 기록이 없습니다.</p>'}
function makeAIPlan(){aiRequest('roadmap','',null,'roadmapBtn','aiPlan')}
function askCoach(i){const q=$('aiQuestion').value.trim();if(q.length<5){$('aiCoach').style.display='block';$('aiCoach').textContent='궁금한 점을 5자 이상 적어 주세요.';return}aiRequest('coach',q,TOPICS[data.type][i],'coachBtn','aiCoach')}

function downloadFile(name,content,type){const blob=new Blob([content],{type});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backupData(){archiveCurrent();save();const payload={format:'vibequest-backup',version:1,exportedAt:new Date().toISOString(),data};downloadFile('vibe-quest-backup.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8')}
function showBackup(){layout('<button class="btn ghost" onclick="dashboard()">← 내 학습</button><h1>학습 기록 백업·복원</h1><div class="card"><h3>내 기록을 파일로 보관하기</h3><p class="muted">프로젝트 목표, 퀘스트 진행도, 실습 증빙과 메모, AI 질문 기록을 JSON 파일로 저장합니다. 다른 브라우저에서도 파일을 가져와 이어서 학습할 수 있습니다.</p><div class="backup-actions"><button class="btn" onclick="backupData()">백업 파일 다운로드</button><button class="btn secondary" onclick="document.getElementById(\'backupFile\').click()">기록 파일 불러오기</button></div><input class="backup-input" id="backupFile" type="file" accept=".json,application/json" onchange="restoreFile(this)"><p class="notice">복원하면 현재 브라우저의 학습 기록이 교체됩니다. 먼저 현재 기록을 백업하세요. 파일 안에는 사용자가 작성한 프로젝트 설명과 메모가 포함됩니다.</p><p class="note" id="restoreStatus"></p></div>')}
async function restoreFile(input){const file=input.files?.[0];if(!file)return;if(file.size>2000000){$('restoreStatus').textContent='백업 파일은 2MB 이하만 불러올 수 있습니다.';return}try{const obj=JSON.parse(await file.text());const d=obj?.data;if(obj.format!=='vibequest-backup'||obj.version!==1||!d||typeof d!=='object'||!Object.hasOwn(TYPES,d.type)||!Array.isArray(d.done)||d.done.length>7||typeof d.description!=='string'||d.description.length>1200)throw Error('invalid');if(!confirm('현재 브라우저의 학습 기록을 백업 파일 내용으로 교체할까요?'))return;data={type:d.type,experience:String(d.experience||'none'),tool:String(d.tool||'recommend'),description:d.description,step:0,done:d.done.map(Boolean),evidence:d.evidence&&typeof d.evidence==='object'?d.evidence:{},notes:d.notes&&typeof d.notes==='object'?d.notes:{},criteria:d.criteria&&typeof d.criteria==='object'?d.criteria:{},aiHistory:d.aiHistory&&typeof d.aiHistory==='object'?d.aiHistory:{},aiPlan:String(d.aiPlan||''),quizPassed:d.quizPassed&&typeof d.quizPassed==='object'?d.quizPassed:{},projects:Array.isArray(d.projects)?d.projects.slice(0,30):[],activeId:String(d.activeId||'legacy')};save();dashboard();alert('학습 기록을 복원했습니다.')}catch{$('restoreStatus').textContent='올바른 VIBE QUEST 백업 파일인지 확인해 주세요.'}finally{input.value=''}}

function snapshot(){return {type:data.type,description:data.description,experience:data.experience,tool:data.tool,done:[...data.done],evidence:{...data.evidence},notes:{...data.notes},criteria:{...data.criteria},aiHistory:{...data.aiHistory},aiPlan:data.aiPlan||'',quizPassed:{...(data.quizPassed||{})},activeId:data.activeId||'legacy'}}
function archiveCurrent(){data.projects=data.projects||[];if(!data.activeId)data.activeId='legacy';const x=snapshot();const index=data.projects.findIndex(p=>p.activeId===x.activeId);if(index>=0)data.projects[index]=x;else data.projects.push(x)}
function projectsPage(){archiveCurrent();save();const items=data.projects||[];layout('<h1>내 프로젝트</h1><p class="muted">프로젝트별 학습 기록을 독립적으로 관리합니다. 새 프로젝트로 이동해도 기존 진행도가 유지됩니다.</p><button class="btn" onclick="start()">+ 새 프로젝트 만들기</button><div class="card" style="margin-top:18px">'+items.map((p,i)=>'<div class="project-item"><strong>'+esc(p.description||TYPES[p.type]?.[1]||'내 프로젝트')+'</strong><p class="status">'+(p.done||[]).filter(Boolean).length+'/7단계 완료 · '+esc(TYPES[p.type]?.[1]||'기타')+'</p><button class="btn secondary" onclick="openProject('+i+')">학습 이어가기</button></div>').join('')+'</div>')}
function openProject(i){archiveCurrent();const p=data.projects?.[i];if(!p)return;const projects=data.projects;Object.assign(data,{...p,projects,step:0});data.quizPassed={...(p.quizPassed||{})};save();dashboard()}
async function checkUrl(){const v=$('result').value.trim(),status=$('urlStatus');let url;try{url=new URL(v);if(!['http:','https:'].includes(url.protocol))throw Error('scheme')}catch{status.textContent='http:// 또는 https://로 시작하는 유효한 URL을 입력해 주세요.';return}status.textContent='접속 상태를 확인하는 중입니다…';try{await fetch(url.href,{mode:'no-cors',cache:'no-store',signal:AbortSignal.timeout(6000)});status.textContent='브라우저에서 요청을 보냈습니다. 실제 페이지의 표시·기능 정상 여부는 직접 열어 확인해야 합니다.'}catch{status.textContent='접속 확인에 실패했거나 브라우저 보안 정책으로 차단되었습니다. 주소를 새 탭에서 직접 확인해 주세요.'}}

const LESSON_LIBRARY=[
{intro:'목표를 너무 크게 잡으면 AI도 엉뚱한 결과를 만들기 쉽습니다.',actions:['누가 사용할지 한 문장으로 적기','처음 공개할 때 꼭 필요한 기능만 세 개 선택하기','당장 만들지 않을 기능을 제외하기'],tip:'예: 포트폴리오 사이트라면 작품 목록, 자기소개, 연락하기만 먼저 완성합니다.',question:'처음 만드는 MVP에서 가장 중요한 것은?',answers:['생각한 기능을 전부 구현하기','핵심 기능부터 작동하게 만들기','디자인을 먼저 100% 완성하기'],correct:1},
{intro:'AI에 요청할 때 결과물·제약·확인 방법을 함께 알려주는 연습입니다.',actions:['원하는 화면을 말로 설명하기','사용자와 화면에서 할 일을 적기','AI 결과를 열어 수정할 한 가지를 찾기'],tip:'좋은 요청: 모바일에서도 보기 편한 작품 목록 화면을 만들어줘. 작품은 카드 3개로 보여줘.',question:'AI가 잘못 이해했을 때 가장 좋은 행동은?',answers:['같은 요청을 반복한다','수정할 부분과 기대 결과를 구체적으로 말한다','코드 전체를 삭제한다'],correct:1},

function lessonMarkup(i){const l=LESSON_LIBRARY[i];return '<div class="lesson-detail"><strong>이번 퀘스트에서 배울 것</strong><p>'+esc(l.intro)+'</p><ol>'+l.actions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ol><p>💡 '+esc(l.tip)+'</p></div><div class="lesson-detail"><strong>이해도 확인 · 1문제</strong><p>'+esc(l.question)+'</p>'+l.answers.map((a,j)=>'<button type="button" class="quiz-option" onclick="answerQuiz('+i+','+j+')">'+esc(a)+'</button>').join('')+'<div class="quiz-feedback" id="quizFeedback">'+(data.quizPassed?.[i]?'✅ 이해도 확인 완료':'정답을 선택해 보세요.')+'</div></div>'}
function answerQuiz(i,j){const ok=j===LESSON_LIBRARY[i].correct;data.quizPassed=data.quizPassed||{};if(ok){data.quizPassed[i]=true;save()}const el=$('quizFeedback');if(el)el.textContent=ok?'✅ 정답입니다. 이제 실제 프로젝트에 적용해 보세요.':'다시 생각해 보세요. 핵심은 실제 결과를 확인하는 것입니다.'}

function qaMarkup(i){const checks=CHECKS[i];return '<div class="card" style="margin-top:18px"><h3>🧪 프로젝트 자체 QA</h3><p class="note">이 체크리스트는 사용자 확인용입니다. 자동으로 외부 웹사이트의 기능을 검증하지는 않습니다.</p>'+checks.map((x,k)=>'<label class="qa-row check"><input type="checkbox" class="qa-check" onchange="updateQaCount()"><span>'+esc(x)+'</span></label>').join('')+'<div class="qa-summary" id="qaCount">0 / '+checks.length+'개 확인</div></div>'}
function updateQaCount(){const xs=[...document.querySelectorAll('.qa-check')];if($('qaCount'))$('qaCount').textContent=xs.filter(x=>x.checked).length+' / '+xs.length+'개 확인'}

function openResult(){const input=$('result');if(!input)return;let u;try{u=new URL(input.value.trim());if(!['http:','https:'].includes(u.protocol))throw Error('bad');window.open(u.href,'_blank','noopener,noreferrer')}catch{const x=$('urlStatus');if(x)x.textContent='먼저 http 또는 https로 시작하는 공개 URL을 입력해 주세요.'}}
