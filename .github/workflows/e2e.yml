name: Browser regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        run: node scripts/check-inline-syntax.cjs
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Run Chromium and iPhone Safari WebKit regression suite
        run: npm run test:e2e
        env:
          CI: 'true'
      - name: Publish test summary
        if: always()
        run: |
          if [ -f test-results/results.json ]; then
            node -e 'const f=require("./test-results/results.json"); const s=f.stats||{}; require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Playwright QA\nPassed: ${s.expected||0}  Failed: ${s.unexpected||0}  Skipped: ${s.skipped||0}\n`);'
          else
            echo 'Playwright result missing: test execution did not reach JSON output.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
